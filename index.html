<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務の記録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    body {
      font-family: system-ui, -apple-system;
      background:#f9f9f9;
      margin:0;
      padding-bottom: 40px;
    }

    form {
      max-width:600px;
      margin:30px auto;
      background:#fff;
      padding:18px;
      border-radius:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }

    label {
      margin-top:15px;
      display:block;
      font-weight:bold;
      font-size:14px;
    }

    .inline-group {
      display:flex;
      gap:12px;
      margin-top: 5px;
    }

    .inline-group input {
      width:100%;
      height:36px;
      padding:2px 8px;
      font-size:14px;
      border:1px solid #ccc;
      border-radius:6px;
      box-sizing: border-box;
    }

    .hidden { display:none; }

    button {
      width:100%;
      margin-top:30px;
      padding:15px;
      font-size:16px;
      background:#00bcd4;
      color:#fff;
      border:none;
      border-radius:8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:active { background:#0097a7; }

    .check-item {
      padding:10px 0;
      border-bottom:1px solid #eee;
    }

    .right-block {
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
    }

    .row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:100%;
      margin:0;
    }

    .label-text {
      font-size:13px;
      color: #333;
      flex: 1;
      padding-right: 10px;
    }

    .status-text {
      font-weight:bold;
      font-size:12px;
      color: #00bcd4;
    }

    /* スイッチのデザイン */
    .switch {
      position:relative;
      display:inline-block;
      width:46px;
      height:24px;
    }

    .switch input { display:none; }

    .slider {
      position:absolute;
      cursor:pointer;
      top:0; left:0; right:0; bottom:0;
      background-color:#ccc;
      border-radius:34px;
      transition:.3s;
    }

    .slider:before {
      position:absolute;
      content:"";
      height:18px;
      width:18px;
      left:3px;
      bottom:3px;
      background:white;
      border-radius:50%;
      transition:.3s;
    }

    .switch input:checked + .slider {
      background-color:#00bcd4;
    }

    .switch input:checked + .slider:before {
      transform:translateX(22px);
    }

    @media (max-width:480px) {
      form { margin: 10px; }
      .label-text { font-size:12px; }
    }
  </style>
</head>

<body>
<h2 style="text-align:center;">業務の記録</h2>

<form id="form">

  <div class="inline-group">
    <div style="flex:1;">
      <label>日付</label>
      <input type="date" id="date" required>
    </div>

    <div style="flex:1;">
      <label>点呼時刻</label>
      <input type="time" id="callTime" required>
    </div>
  </div>

  <label>走行距離 (km)</label>
  <div class="inline-group">
    <div style="flex:1;">
      <input type="number" id="distanceBefore" placeholder="開始" required>
    </div>
    <div style="flex:1;">
      <input type="number" id="distanceAfter" placeholder="終了" required>
    </div>
    <div style="flex:1;">
      <input type="number" id="totalDistance" placeholder="合計" readonly style="background:#f0f0f0;">
    </div>
  </div>

  <label>点呼区分</label>
  <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
    <label class="switch">
      <input type="checkbox" id="callTypeToggle">
      <span class="slider"></span>
    </label>
    <span id="callTypeResult" style="font-weight:bold;">業務前</span>
  </div>

  <input type="hidden" id="callTypeHidden" value="業務前">

  <div id="checklistBefore">
    <label style="color:#00bcd4; margin-top:20px;">▼ 点検項目（業務前）</label>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="alcoholBeforeStatus">未使用</span>
        <div class="row">
          <span class="label-text">アルコール検知器の使用</span>
          <label class="switch">
            <input type="checkbox" id="alcoholBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="vehicleBeforeStatus">異常</span>
        <div class="row">
          <span class="label-text">車両異常確認</span>
          <label class="switch">
            <input type="checkbox" id="vehicleBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="conditionBeforeStatus">不調</span>
        <div class="row">
          <span class="label-text">体調確認</span>
          <label class="switch">
            <input type="checkbox" id="conditionBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="drunkBeforeStatus">有</span>
        <div class="row">
          <span class="label-text">酒気帯びの有無</span>
          <label class="switch">
            <input type="checkbox" id="drunkBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
    </div>

  <div id="checklistAfter" class="hidden">
    <label style="color:#00bcd4; margin-top:20px;">▼ 点検項目（業務後）</label>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="alcoholAfterStatus">未使用</span>
        <div class="row">
          <span class="label-text">アルコール検知器の使用</span>
          <label class="switch">
            <input type="checkbox" id="alcoholAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="vehicleAfterStatus">異常</span>
        <div class="row">
          <span class="label-text">車両異常確認</span>
          <label class="switch">
            <input type="checkbox" id="vehicleAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="conditionAfterStatus">不調</span>
        <div class="row">
          <span class="label-text">体調確認</span>
          <label class="switch">
            <input type="checkbox" id="conditionAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="drunkAfterStatus">有</span>
        <div class="row">
          <span class="label-text">酒気帯びの有無</span>
          <label class="switch">
            <input type="checkbox" id="drunkAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <button type="submit">この内容で送信保存</button>

<script>
// 初期化：日付と時間をセット
function init() {
  const now = new Date();
  document.getElementById('date').value = now.toISOString().split('T')[0];
  document.getElementById('callTime').value = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
}

// 走行距離の自動計算
function calcTotal() {
  const before = parseFloat(document.getElementById('distanceBefore').value) || 0;
  const after = parseFloat(document.getElementById('distanceAfter').value) || 0;
  const totalField = document.getElementById('totalDistance');
  
  if (after >= before && before > 0) {
    totalField.value = (after - before).toFixed(1);
  } else {
    totalField.value = "";
  }
}

// ステータステキストの連動
function bindStatus(toggleId, statusId, onText, offText) {
  const toggle = document.getElementById(toggleId);
  const status = document.getElementById(statusId);
  if (!toggle || !status) return;

  const updateText = () => {
    status.textContent = toggle.checked ? onText : offText;
    status.style.color = toggle.checked ? "#00bcd4" : "#f44336"; // ONで青、OFFで赤
  };

  toggle.addEventListener("change", updateText);
  updateText(); // 初期実行
}

// 全てのイベント設定
window.addEventListener("DOMContentLoaded", () => {
  init();

  // 距離計算のイベント
  document.getElementById('distanceBefore').addEventListener("input", calcTotal);
  document.getElementById('distanceAfter').addEventListener("input", calcTotal);

  // 点呼区分切り替え
  const callTypeToggle = document.getElementById('callTypeToggle');
  callTypeToggle.addEventListener("change", e => {
    const isAfter = e.target.checked;
    document.getElementById("callTypeResult").textContent = isAfter ? "業務後" : "業務前";
    document.getElementById("callTypeHidden").value = isAfter ? "業務後" : "業務前";
    document.getElementById("checklistBefore").classList.toggle("hidden", isAfter);
    document.getElementById("checklistAfter").classList.toggle("hidden", !isAfter);
  });

  // 各スイッチの文字連動設定
  bindStatus("alcoholBefore", "alcoholBeforeStatus", "使用", "未使用");
  bindStatus("vehicleBefore", "vehicleBeforeStatus", "正常", "異常");
  bindStatus("conditionBefore", "conditionBeforeStatus", "良好", "不調");
  bindStatus("drunkBefore", "drunkBeforeStatus", "無", "有");

  bindStatus("alcoholAfter", "alcoholAfterStatus", "使用", "未使用");
  bindStatus("vehicleAfter", "vehicleAfterStatus", "正常", "異常");
  bindStatus("conditionAfter", "conditionAfterStatus", "良好", "不調");
  bindStatus("drunkAfter", "drunkAfterStatus", "無", "有");

  // 送信処理
  document.getElementById('form').addEventListener("submit", e => {
    e.preventDefault();
    
    const data = {
      date: document.getElementById('date').value,
      callType: document.getElementById('callTypeHidden').value,
      callTime: document.getElementById('callTime').value,
      distanceBefore: document.getElementById('distanceBefore').value,
      distanceAfter: document.getElementById('distanceAfter').value,
      totalDistance: document.getElementById('totalDistance').value,
      status: {
        alcohol: document.getElementById(callTypeToggle.checked ? 'alcoholAfterStatus' : 'alcoholBeforeStatus').textContent,
        condition: document.getElementById(callTypeToggle.checked ? 'conditionAfterStatus' : 'conditionBeforeStatus').textContent
        // 必要に応じて追加
      }
    };

    console.log("送信データ:", data);
    alert("保存しました（GAS_WEBAPP_URLが未設定のためコンソール出力のみ）");
    // 本番はここにfetch処理を記述
  });
});
</script>

</form>
</body>
</html>
