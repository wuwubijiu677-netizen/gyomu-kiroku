<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>業務の記録</title>

<style>
/* ===== 全体 ===== */
body {
  font-family: system-ui, -apple-system;
  background: #e6ebf2;
  margin: 0;
  padding: 12px;
}

/* PCでも広がらない */
.container {
  max-width: 680px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin: 12px 0 20px;
}

/* ===== カード ===== */
.card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}

/* ===== 入力 ===== */
label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #bbb;
}

textarea {
  resize: vertical;
}

/* ===== 横並び ===== */
.row {
  display: flex;
  gap: 12px;
}

.row > div {
  flex: 1;
}

/* ===== トグル ===== */
.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toggle-text {
  font-weight: bold;
  font-size: 16px;
}

.toggle input {
  display: none;
}

.slider {
  width: 60px;
  height: 30px;
  background: #666;
  border-radius: 15px;
  position: relative;
  cursor: pointer;
}

.slider::before {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  top: 3px;
  left: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background: #2e7d32;
}

input:checked + .slider::before {
  transform: translateX(30px);
}

/* ===== 点検 ===== */
.checks label {
  display: block;
  margin: 6px 0;
}

/* ===== ボタン ===== */
button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  background: #1976d2;
  color: #fff;
  border: none;
  border-radius: 14px;
}
</style>
</head>

<body>
<div class="container">

<h1>業務の記録</h1>

<div class="card row">
  <div>
    <label>日付</label>
    <input type="date" id="date">
  </div>
  <div>
    <label>点呼時刻</label>
    <input type="time" id="callTime">
  </div>
</div>

<div class="card toggle-row">
  <span id="callTypeText" class="toggle-text">業務前</span>
  <label class="toggle">
    <input type="checkbox" id="callType">
    <span class="slider"></span>
  </label>
</div>

<div class="card" id="beforeBlock">
  <label>走行距離（運行前）</label>
  <input type="number" id="beforeKm">
</div>

<div class="card" id="afterBlock" style="display:none">
  <label>走行距離（運行後）</label>
  <input type="number" id="afterKm">
  <p>当日距離：<b id="totalKm">―</b> km</p>
</div>

<div class="card toggle-row">
  <span id="alcoholText" class="toggle-text">アルコール未使用</span>
  <label class="toggle">
    <input type="checkbox" id="alcohol">
    <span class="slider"></span>
  </label>
</div>

<div class="card toggle-row">
  <span id="healthText" class="toggle-text">健康未確認</span>
  <label class="toggle">
    <input type="checkbox" id="health">
    <span class="slider"></span>
  </label>
</div>

<div class="card">
  <label>業務内容</label>
  <textarea id="work"></textarea>
</div>

<div class="card checks">
  <label><input type="checkbox" id="tire"> タイヤ</label>
  <label><input type="checkbox" id="oil"> 油脂類</label>
  <label><input type="checkbox" id="lamp"> 灯火類</label>
  <label><input type="checkbox" id="engine"> エンジン</label>
</div>

<button id="save">保存</button>

</div>

<script>
/* 初期日付 */
const now = new Date();
date.value = now.toISOString().slice(0,10);
callTime.value = now.toTimeString().slice(0,5);

/* 業務前後 */
callType.onchange = () => {
  const after = callType.checked;
  callTypeText.textContent = after ? "業務後" : "業務前";
  beforeBlock.style.display = after ? "none" : "block";
  afterBlock.style.display = after ? "block" : "none";
};

/* 距離計算 */
afterKm.oninput = () => {
  const b = Number(beforeKm.value);
  const a = Number(afterKm.value);
  totalKm.textContent = (a >= b) ? (a - b) : "―";
};

/* 表示切替 */
alcohol.onchange = () => alcoholText.textContent = alcohol.checked ? "アルコール使用" : "アルコール未使用";
health.onchange = () => healthText.textContent = health.checked ? "健康良好" : "健康未確認";
</script>

</body>
</html>
