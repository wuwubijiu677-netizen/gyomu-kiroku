<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務記録（屋比久 悟）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { --primary: #00bcd4; --bg: #f5f7f8; --text: #333; }
    body { font-family: system-ui, -apple-system; background: var(--bg); margin: 0; color: var(--text); padding-bottom: 40px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--primary); color: #fff; padding: 20px; text-align: center; }
    .step-bar { display: flex; background: #e0f7fa; padding: 10px 0; border-bottom: 1px solid #b2ebf2; }
    .step { flex: 1; text-align: center; font-size: 12px; color: #888; font-weight: bold; }
    .step.active { color: var(--primary); }
    form { padding: 20px; flex: 1; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    label { display: block; margin-top: 18px; font-weight: bold; font-size: 13px; color: #555; }
    .field-group { display: flex; gap: 20px; align-items: flex-end; }
    .field-group > div { flex: 1; width: 50%; }
    input, select, textarea { width: 100%; padding: 10px 6px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    input[type="date"], input[type="time"] { font-size: 14px; padding: 10px 4px; }
    .readonly-field { background: #f0f0f0; color: #666; border-color: #eee; }
    .check-list-container { margin-top: 15px; border-top: 2px solid var(--primary); padding-top: 10px; }
    .check-item { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .label-text { font-size: 13px; line-height: 1.4; flex: 1; padding-right: 10px; }
    .status-text { font-size: 11px; font-weight: bold; color: #f44336; margin-bottom: 4px; display: block; text-align: right; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
    .switch input { display: none; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 34px; transition: .3s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background: var(--primary); }
    input:checked + .slider:before { transform: translateX(24px); }
    .btn-group { margin-top: 35px; display: flex; gap: 12px; }
    button { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-next { background: var(--primary); color: #fff; }
    .btn-submit { background: #4caf50; color: #fff; }
    .btn-back { background: #78909c; color: #fff; } /* 戻るボタン用の色 */
    .btn-cancel { background: #9e9e9e; color: #fff; font-size: 12px; margin-top: 30px; width: 100%; height: 40px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h2>業務記録（屋比久 悟）</h2></div>
  <div class="step-bar">
    <div id="step1-tab" class="step active">1. 運行前入力</div>
    <div id="step2-tab" class="step">2. 運行後・送信</div>
  </div>
  <form id="recordForm">
    <div id="page1" class="page active">
      <div class="field-group">
        <div><label>運行前日付</label><input type="date" id="dateBefore" required></div>
        <div><label>開始時間</label><input type="time" id="startTime" required></div>
      </div>
      <div class="field-group">
        <div><label>点呼方法</label><select id="methodBefore"><option>対面</option><option>電話</option><option>IT点呼</option></select></div>
        <div><label>執行者</label><input type="text" value="屋比久悟" class="readonly-field" readonly></div>
      </div>
      <label>走行距離計（前） [km]</label><input type="number" id="distStart" placeholder="開始距離" step="0.1" required>
      <label>アルコール検査値（前） [mg/L]</label><input type="number" id="alcBefore" step="0.01" value="0.00">
      <div class="check-list-container"><label style="color:var(--primary);">▼ 運行前 点検項目</label><div id="itemsBeforeContainer"></div></div>
      <textarea id="memoBefore" placeholder="運行前の特記事項" rows="2" style="margin-top:15px;"></textarea>
      <div class="btn-group">
        <button type="button" class="btn-next" onclick="nextPage()">次へ（運行開始） ＞</button>
      </div>
    </div>

    <div id="page2" class="page">
      <div class="field-group">
        <div><label>運行後日付</label><input type="date" id="dateAfter" required></div>
        <div><label>完了時間</label><input type="time" id="endTime" required></div>
      </div>
      <div class="field-group">
        <div><label>点呼方法</label><select id="methodAfter"><option>対面</option><option>電話</option><option>IT点呼</option></select></div>
        <div><label>執行者</label><input type="text" value="屋比久悟" class="readonly-field" readonly></div>
      </div>
      <div class="field-group">
        <div><label>走行距離計（後） [km]</label><input type="number" id="distEnd" placeholder="終了距離" step="0.1"></div>
        <div><label>総走行距離計 [km]</label><input type="text" id="distTotal" class="readonly-field" readonly placeholder="自動計算"></div>
      </div>
      <label>アルコール検査値（後） [mg/L]</label><input type="number" id="alcAfter" step="0.01" value="0.00">
      <div class="check-list-container"><label style="color:var(--primary);">▼ 運行後 点検項目</label><div id="itemsAfterContainer"></div></div>
      <textarea id="memoAfter" placeholder="運行後の特記事項" rows="2" style="margin-top:15px;"></textarea>
      
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage()">＜ 戻る(修正)</button>
        <button type="submit" class="btn-submit">一括送信</button>
      </div>
      
      <button type="button" class="btn-cancel" onclick="resetToNew()">運行前の入力を取消して新規作成</button>
    </div>
  </form>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwSnNLYIgoEYACqILc6xuBo-iXBPA0bLmKncqEkc1e_bgSBMtB7VXIeJiivj8S9WREaHg/exec"; 
const STORAGE_KEY = 'gyomu_v12_state';

const checkItems = [
  { id: "alc", label: "アルコール検知器使用", short: "ｱﾙｺｰﾙ", on: "⚪︎", off: "×未使用" },
  { id: "tire", label: "タイヤ（空気圧・亀裂・摩耗・取付）", short: "ﾀｲﾔ", on: "⚪︎", off: "×異常" },
  { id: "light", label: "灯火類（指示・非常・制動・後退・尾灯）", short: "灯火", on: "⚪︎", off: "×異常" },
  { id: "oil", label: "油脂類（ブレーキ・パワステ・オイル・水）", short: "油脂", on: "⚪︎", off: "×異常" },
  { id: "veh", label: "車両異常（異音・バッテリー・ベルト類）", short: "車両", on: "⚪︎", off: "×異常" },
  { id: "cond", label: "体調確認（睡眠不足・疾病・疲労等）", short: "体調", on: "良好", off: "×不調" },
  { id: "drk", label: "酒気帯び有無", short: "酒気", on: "無", off: "×【有】" },
  { id: "lic", label: "免許証携帯確認", short: "免許", on: "携帯", off: "×不携帯" }
];

function init() {
  const now = new Date();
  const dStr = now.toISOString().split('T')[0];
  const tStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  
  document.getElementById('dateBefore').value = dStr;
  document.getElementById('dateAfter').value = dStr;
  document.getElementById('startTime').value = tStr;
  document.getElementById('endTime').value = tStr;

  renderItems("itemsBeforeContainer", "B");
  renderItems("itemsAfterContainer", "A");

  loadData();

  ['distStart','distEnd'].forEach(id => document.getElementById(id).addEventListener('input', calcTotal));
  document.querySelectorAll('input, select, textarea').forEach(el => el.addEventListener('input', () => saveData()));
}

function renderItems(cid, suf) {
  const container = document.getElementById(cid);
  checkItems.forEach(i => {
    const id = i.id + suf;
    container.insertAdjacentHTML('beforeend', `
      <div class="check-item">
        <span class="label-text">${i.label}</span>
        <div>
          <span class="status-text" id="${id}S">${i.off}</span>
          <label class="switch"><input type="checkbox" id="${id}"><span class="slider"></span></label>
        </div>
      </div>`);
    document.getElementById(id).addEventListener('change', () => {
      updateCheckStyle(id, i);
      saveData();
    });
  });
}

function updateCheckStyle(id, item) {
  const cb = document.getElementById(id);
  const st = document.getElementById(id + "S");
  if(!cb || !st) return;
  st.textContent = cb.checked ? item.on : item.off;
  st.style.color = cb.checked ? "#00bcd4" : "#f44336";
}

function nextPage() {
  if (!document.getElementById('distStart').value) { alert("開始距離を入力してください"); return; }
  showPage("page2");
  saveData("page2");
}

function prevPage() {
  showPage("page1");
  saveData("page1");
}

function showPage(pageId) {
  document.getElementById('page1').classList.toggle('active', pageId === 'page1');
  document.getElementById('page2').classList.toggle('active', pageId === 'page2');
  document.getElementById('step1-tab').classList.toggle('active', pageId === 'page1');
  document.getElementById('step2-tab').classList.toggle('active', pageId === 'page2');
  window.scrollTo(0,0);
}

function calcTotal() {
  const s = parseFloat(document.getElementById('distStart').value)||0;
  const e = parseFloat(document.getElementById('distEnd').value)||0;
  document.getElementById('distTotal').value = (e - s > 0) ? (e - s).toFixed(1) : "0.0";
}

function saveData(currentPage) {
  const state = {
    page: currentPage || (document.getElementById('page2').classList.contains('active') ? "page2" : "page1"),
    vals: {
      dateBefore: document.getElementById('dateBefore').value,
      startTime: document.getElementById('startTime').value,
      methodBefore: document.getElementById('methodBefore').value,
      distStart: document.getElementById('distStart').value,
      alcBefore: document.getElementById('alcBefore').value,
      memoBefore: document.getElementById('memoBefore').value,
      dateAfter: document.getElementById('dateAfter').value,
      endTime: document.getElementById('endTime').value,
      methodAfter: document.getElementById('methodAfter').value,
      distEnd: document.getElementById('distEnd').value,
      alcAfter: document.getElementById('alcAfter').value,
      memoAfter: document.getElementById('memoAfter').value
    },
    checks: {}
  };
  checkItems.forEach(i => {
    state.checks[i.id+"B"] = document.getElementById(i.id+"B").checked;
    state.checks[i.id+"A"] = document.getElementById(i.id+"A").checked;
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  const state = JSON.parse(saved);
  
  Object.keys(state.vals).forEach(id => {
    if(document.getElementById(id)) document.getElementById(id).value = state.vals[id];
  });
  
  checkItems.forEach(i => {
    ["B", "A"].forEach(suf => {
      const id = i.id + suf;
      if(state.checks[id]) {
        const cb = document.getElementById(id);
        if(cb) {
          cb.checked = true;
          updateCheckStyle(id, i);
        }
      }
    });
  });

  calcTotal();
  if(state.page === "page2") showPage("page2");
}

function resetToNew() {
  if(confirm("全ての入力を削除して、新規作成に戻りますか？")) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

document.getElementById('recordForm').onsubmit = async (e) => {
  e.preventDefault();
  if (!document.getElementById('distEnd').value) { alert("終了距離を入力してください"); return; }
  
  const btn = e.target.querySelector('.btn-submit');
  btn.disabled = true; btn.textContent = "送信中...";
  
  const data = {
    dateBefore: document.getElementById('dateBefore').value,
    driver: "屋比久悟",
    carNo: "足立481り9586",
    startTime: document.getElementById('startTime').value,
    methodBefore: document.getElementById('methodBefore').value,
    distStart: document.getElementById('distStart').value,
    alcBefore: document.getElementById('alcBefore').value,
    checkItemsBefore: getCheckResultsText("B"),
    memoBefore: document.getElementById('memoBefore').value,
    dateAfter: document.getElementById('dateAfter').value,
    endTime: document.getElementById('endTime').value,
    methodAfter: document.getElementById('methodAfter').value,
    distEnd: document.getElementById('distEnd').value,
    distTotal: document.getElementById('distTotal').value,
    alcAfter: document.getElementById('alcAfter').value,
    checkItemsAfter: getCheckResultsText("A"),
    memoAfter: document.getElementById('memoAfter').value
  };

  try {
    await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams({contents: JSON.stringify(data)}) });
    alert("送信完了！スプレッドシートを確認してください。");
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  } catch (err) {
    alert("送信エラーが発生しました。");
    btn.disabled = false; btn.textContent = "一括送信";
  }
};

function getCheckResultsText(suffix) {
  return checkItems.map(item => {
    const isChecked = document.getElementById(item.id + suffix).checked;
    return `${item.short}:${isChecked ? item.on : item.off}`;
  }).join(", ");
}

window.onload = init;
</script>
</body>
</html>
