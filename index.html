<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務の記録</title>

<style>
/* ===== 全体 ===== */
body {
  font-family: system-ui, -apple-system;
  background: #e5e9f0; /* ← 白すぎ防止 */
  margin: 0;
  padding: 12px;
}

h1 {
  text-align: center;
  margin-bottom: 16px;
}

/* ===== カード ===== */
.card {
  background: #ffffff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}

/* ===== 入力 ===== */
label {
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-top: 6px;
  border-radius: 10px;
  border: 1px solid #bbb;
}

/* ===== トグル ===== */
.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toggle-text {
  font-size: 16px;
  font-weight: bold;
  color: #444;
}

.toggle input {
  display: none;
}

.slider {
  width: 60px;
  height: 30px;
  background: #666;          /* ← OFF時は濃いグレー */
  border-radius: 15px;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
}

.slider::before {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  top: 3px;
  left: 3px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.3s;
}

/* ON状態 */
input:checked + .slider {
  background: #2e7d32; /* ← はっきり緑 */
}

input:checked + .slider::before {
  transform: translateX(30px);
}

/* ===== ボタン ===== */
button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  background: #1976d2;
  color: #fff;
  border: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>業務の記録</h1>

<div class="card">
  <label>日付</label>
  <input type="date" id="date">
</div>

<div class="card">
  <label>点呼区分</label>
  <div class="toggle-row">
    <span id="callTypeText" class="toggle-text">業務前</span>
    <label class="toggle">
      <input type="checkbox" id="callType">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="card">
  <label>点呼時刻</label>
  <input type="time" id="callTime">
</div>

<div class="card">
  <label>業務内容</label>
  <textarea id="workType"></textarea>
</div>

<button id="saveBtn">保存</button>

<script>
/* ===== DOM取得 ===== */
const callType = document.getElementById("callType");
const callTypeText = document.getElementById("callTypeText");

/* ===== トグル表示切替 ===== */
callType.addEventListener("change", () => {
  if (callType.checked) {
    callTypeText.textContent = "業務後";
    callTypeText.style.color = "#2e7d32";
  } else {
    callTypeText.textContent = "業務前";
    callTypeText.style.color = "#444";
  }
});
</script>

</body>
</html>
