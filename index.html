<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務の記録</title>

<style>
body {
  font-family: system-ui, -apple-system;
  background: #eef3f7;
  margin: 0;
  padding: 12px;
}

h1 {
  text-align: center;
  font-size: 20px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

label {
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 8px;
  font-size: 16px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toggle input {
  display: none;
}

.slider {
  width: 56px;
  height: 28px;
  background: #aaa;
  border-radius: 14px;
  position: relative;
  cursor: pointer;
}

.slider::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  top: 3px;
  left: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background: #1976d2;
}

input:checked + .slider::before {
  transform: translateX(28px);
}

button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: #1976d2;
  color: #fff;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>業務の記録</h1>

<div class="card">
  <label>日付</label>
  <input type="date" id="date">
</div>

<div class="card">
  <label>点呼区分</label>
  <div class="toggle-row">
    <span id="callTypeText">業務前</span>
    <label class="toggle">
      <input type="checkbox" id="callType">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="card">
  <label>点呼時刻</label>
  <input type="time" id="callTime">
</div>

<div class="card">
  <label>業務内容</label>
  <textarea id="workType"></textarea>
</div>

<button id="saveBtn">保存</button>

<script>
/* ===== DOM取得（これが無いと全部動かない）===== */
const callType = document.getElementById("callType");
const callTypeText = document.getElementById("callTypeText");
const saveBtn = document.getElementById("saveBtn");

/* ===== トグル動作 ===== */
callType.addEventListener("change", () => {
  callTypeText.textContent = callType.checked ? "業務後" : "業務前";
});

/* ===== 保存（仮）===== */
saveBtn.addEventListener("click", () => {
  alert("ここまでは正常に動いています");
});
</script>

</body>
</html>
