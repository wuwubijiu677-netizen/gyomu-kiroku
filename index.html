<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>業務の記録 入力フォーム</title>

<style>
/* ===============================
   全体
=============================== */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: #eef3f7;
  margin: 0;
  padding: 12px;
}

h1 {
  text-align: center;
  font-size: 20px;
  margin-bottom: 16px;
}

/* ===============================
   カード
=============================== */
.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

/* ===============================
   入力
=============================== */
input[type="date"],
input[type="time"],
input[type="number"],
textarea {
  width: 100%;
  padding: 8px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

textarea {
  resize: vertical;
}

/* ===============================
   トグルスイッチ
=============================== */
.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
}

.toggle input {
  display: none;
}

.slider {
  width: 56px;
  height: 28px;
  background: #9e9e9e;       /* OFF */
  border-radius: 14px;
  position: relative;
  border: 2px solid #666;
  cursor: pointer;
  transition: background 0.3s;
}

.slider::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  top: 1px;
  left: 1px;
  background: #ffffff;
  border-radius: 50%;
  transition: transform 0.3s;
}

input:checked + .slider {
  background: #1976d2;       /* ON */
  border-color: #0d47a1;
}

input:checked + .slider::before {
  transform: translateX(28px);
}

.result-text {
  font-weight: bold;
  color: #0d47a1;
}

/* ===============================
   ボタン
=============================== */
button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  background: #1976d2;
  color: #fff;
  cursor: pointer;
}

button:active {
  background: #0d47a1;
}
</style>
</head>

<body>

<h1>業務の記録 入力</h1>

<div class="card">
  <label>日付</label>
  <input type="date" id="date">
</div>

<div class="card">
  <label>点呼区分</label>
  <div class="toggle-row">
    <span id="callTypeText">業務前</span>
    <label class="toggle">
      <input type="checkbox" id="callType">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="card">
  <label>点呼時刻</label>
  <input type="time" id="callTime">
</div>

<div class="card">
  <label>走行距離（運行前）</label>
  <input type="number" id="distanceBefore">
</div>

<div class="card">
  <label>走行距離（運行後）</label>
  <input type="number" id="distanceAfter">
</div>

<div class="card">
  <label>アルコールチェック</label>
  <div class="toggle-row">
    <span id="alcoholText">異常なし</span>
    <label class="toggle">
      <input type="checkbox" id="alcohol">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="card">
  <label>健康状態</label>
  <div class="toggle-row">
    <span id="healthText">良好</span>
    <label class="toggle">
      <input type="checkbox" id="health">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="card">
  <label>業務内容</label>
  <textarea id="workType" rows="3"></textarea>
</div>

<div class="card">
  <label>運行前点検</label>
  <div>
    <label><input type="checkbox" id="tire"> タイヤ（空気圧・摩耗）</label><br>
    <label><input type="checkbox" id="oil"> 油脂類</label><br>
    <label><input type="checkbox" id="lamp"> 灯火類</label><br>
    <label><input type="checkbox" id="engine"> エンジン</label>
  </div>
</div>

<button onclick="save()">保存</button>

<script>
/* ===============================
   GAS WebApp URL
=============================== */
const GAS_WEBAPP_URL = "ここをあなたのGASのURLに変更";

/* ===============================
   トグル表示切替
=============================== */
callType.onchange = () => {
  callTypeText.textContent = callType.checked ? "業務後" : "業務前";
};

alcohol.onchange = () => {
  alcoholText.textContent = alcohol.checked ? "検出あり" : "異常なし";
};

health.onchange = () => {
  healthText.textContent = health.checked ? "不調" : "良好";
};

/* ===============================
   保存処理
=============================== */
function save() {
  const data = {
    date: date.value,
    callType: callType.checked ? "業務後" : "業務前",
    callTime: callTime.value,
    distanceBefore: distanceBefore.value,
    distanceAfter: distanceAfter.value,
    alcohol: alcohol.checked ? "あり" : "なし",
    health: health.checked ? "不調" : "良好",
    workType: workType.value,
    tire: tire.checked ? "OK" : "NG",
    oil: oil.checked ? "OK" : "NG",
    lamp: lamp.checked ? "OK" : "NG",
    engine: engine.checked ? "OK" : "NG"
  };

  fetch(GAS_WEBAPP_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(() => alert("保存しました"))
  .catch(() => alert("保存に失敗しました"));
}
</script>

</body>
</html>
