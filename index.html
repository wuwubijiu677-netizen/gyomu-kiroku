<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>業務の記録</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" sizes="180x180" href="https://aqua-drop.github.io/assets/311-banchi-icon.png">
<link rel="icon" type="image/png" href="https://aqua-drop.github.io/assets/311-banchi-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<style>
body {
  font-family: system-ui, -apple-system;
  background: #ffffff;
  margin: 0;
  padding: 0;
}

h2 {
  text-align: center;
  margin-top: 24px;
  color: #000;
}

form {
  max-width: 600px;
  margin: 24px auto;
  background: #000;
  color: #fff;
  padding: 24px;
  border-radius: 12px;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

input[type="text"],
input[type="date"],
input[type="time"],
input[type="number"] {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  border-radius: 6px;
  border: none;
  font-size: 16px;
}

.inline-group {
  display: flex;
  gap: 16px;
}

.distance-input {
  display: flex;
  gap: 8px;
  align-items: center;
}

.unit {
  color: #fff;
}

.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
}

.toggle input {
  display: none;
}

.slider {
  width: 64px;
  height: 32px;
  background: #ffffff;
  border-radius: 16px;
  border: 2px solid #aaa;
  position: relative;
  cursor: pointer;
}

.slider::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  top: 1px;
  left: 1px;
  background: #e0e0e0;
  border-radius: 50%;
  transition: transform 0.3s, background 0.3s;
}

input:checked + .slider {
  border-color: #00e5ff;
}

input:checked + .slider::before {
  transform: translateX(32px);
  background: #00e5ff;
}

.result-text {
  margin-left: 8px;
  font-weight: bold;
}

.hidden {
  display: none;
}

fieldset {
  margin-top: 24px;
  padding: 16px;
  border-radius: 8px;
  border: 1px solid #555;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background: #00e5ff;
  color: #000;
}

@media (max-width: 480px) {
  .inline-group {
    flex-direction: column;
  }
}
</style>
</head>

<body onload="init()">

<h2>業務の記録</h2>

<form id="form">

  <div class="inline-group">
    <div>
      <label>日付</label>
      <input type="date" id="date" required>
    </div>
    <div>
      <label>点呼時刻</label>
      <input type="time" id="time" required>
    </div>
  </div>

  <div class="toggle">
    <span>点呼区分</span>
    <label>
      <input type="checkbox" id="callToggle">
      <span class="slider"></span>
      <span class="result-text" id="callText">業務前</span>
    </label>
  </div>

  <label>走行距離（運行前）</label>
  <div class="distance-input">
    <input type="number" id="before">
    <span class="unit">km</span>
  </div>

  <label>走行距離（運行後）</label>
  <div class="distance-input">
    <input type="number" id="after">
    <span class="unit">km</span>
  </div>

  <div class="toggle">
    <span>アルコール検知器</span>
    <label>
      <input type="checkbox" id="alcToggle">
      <span class="slider"></span>
      <span class="result-text" id="alcText">未使用</span>
    </label>
  </div>

  <label>アルコール検査値</label>
  <div class="distance-input">
    <input type="number" step="0.01">
    <span class="unit">mg/L</span>
  </div>

  <div class="toggle">
    <span>健康状態</span>
    <label>
      <input type="checkbox" id="healthToggle">
      <span class="slider"></span>
      <span class="result-text" id="healthText">未確認</span>
    </label>
  </div>

  <label>業務内容</label>
  <input type="text" required>

  <fieldset>
    <legend>点検項目</legend>
    <label><input type="checkbox"> タイヤ</label>
    <label><input type="checkbox"> 油脂類</label>
    <label><input type="checkbox"> 灯火類</label>
    <label><input type="checkbox"> エンジン</label>
  </fieldset>

  <button type="submit">登録を保存する</button>
</form>

<script>
function init() {
  const now = new Date();
  document.getElementById("date").value = now.toISOString().split("T")[0];
  document.getElementById("time").value =
    now.getHours().toString().padStart(2,"0") + ":" +
    now.getMinutes().toString().padStart(2,"0");
}

callToggle.onchange = () =>
  callText.textContent = callToggle.checked ? "業務後" : "業務前";

alcToggle.onchange = () =>
  alcText.textContent = alcToggle.checked ? "使用" : "未使用";

healthToggle.onchange = () =>
  healthText.textContent = healthToggle.checked ? "良好" : "未確認";

form.onsubmit = e => {
  e.preventDefault();
  alert("保存しました（デモ）");
  form.reset();
  init();
};
</script>

</body>
</html>
