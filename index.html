<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務記録システム（一時保存機能付）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { --primary: #00bcd4; --bg: #f5f7f8; --text: #333; }
    body { font-family: system-ui, -apple-system; background: var(--bg); margin: 0; color: var(--text); padding-bottom: 40px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--primary); color: #fff; padding: 20px; text-align: center; }
    .step-bar { display: flex; background: #e0f7fa; padding: 10px 0; border-bottom: 1px solid #b2ebf2; }
    .step { flex: 1; text-align: center; font-size: 12px; color: #888; font-weight: bold; }
    .step.active { color: var(--primary); }
    form { padding: 20px; flex: 1; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    label { display: block; margin-top: 18px; font-weight: bold; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .readonly-field { background: #f0f0f0; color: #666; }
    .info-box { background: #fff9c4; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; border: 1px solid #fbc02d; }
    .check-item { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .status-text { font-size: 11px; font-weight: bold; color: #f44336; margin-bottom: 4px; display: block; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { display: none; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 34px; transition: .3s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background: var(--primary); }
    input:checked + .slider:before { transform: translateX(24px); }
    .btn-group { margin-top: 35px; display: flex; gap: 12px; }
    button { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-next { background: var(--primary); color: #fff; }
    .btn-submit { background: #4caf50; color: #fff; }
    .btn-clear { background: #ff5252; color: #fff; font-size: 12px; padding: 8px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header"><h2>業務記録（屋比久 悟）</h2></div>
  <div class="step-bar">
    <div class="step id-step1 active">1. 運行前入力</div>
    <div class="step id-step2">2. 運行後・一括送信</div>
  </div>

  <form id="recordForm">
    <div id="page1" class="page active">
      <label>車両番号</label>
      <input type="text" value="足立481り9586" class="readonly-field" readonly>
      
      <label>日付</label>
      <input type="date" id="date" required>

      <label>走行距離計（運行前） [km]</label>
      <input type="number" id="distStart" placeholder="開始距離を入力" step="0.1" required>

      <div class="info-box" style="margin-top:20px;">
        💡 朝、距離を入力したら「次へ」を押してください。内容は自動的に保持されます。
      </div>

      <div class="btn-group">
        <button type="button" class="btn-next" onclick="nextPage()">運行後入力へ進む ＞</button>
      </div>
    </div>

    <div id="page2" class="page">
      <div class="info-box">
        運行前距離: <b id="displayStart">0</b> km
      </div>

      <label>走行距離計（運行後） [km]</label>
      <input type="number" id="distEnd" placeholder="終了距離を入力" step="0.1" required>

      <label>総走行距離 [km]</label>
      <input type="text" id="distTotal" class="readonly-field" readonly placeholder="自動計算">

      <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>点呼完了時間</label><input type="time" id="callTime" required></div>
        <div style="flex:1;"><label>点呼執行者</label><input type="text" value="屋比久悟" class="readonly-field" readonly></div>
      </div>

      <label>アルコールチェック (mg/L)</label>
      <input type="number" id="alcValue" placeholder="0.00" step="0.01">

      <div id="checklistArea" style="margin-top:20px; border-top: 2px solid var(--primary);">
        <label style="color:var(--primary);">▼ 点検項目</label>
        <div id="itemsContainer"></div>
      </div>

      <label>特記事項</label>
      <textarea id="memo" placeholder="連絡事項があれば記入" rows="3"></textarea>

      <div class="btn-group">
        <button type="button" onclick="prevPage()">戻る</button>
        <button type="submit" class="btn-submit">データを一括送信</button>
      </div>
      
      <button type="button" class="btn-clear" onclick="clearDraft()">入力をリセットする</button>
    </div>
  </form>
</div>

<script>
const STORAGE_KEY = 'daily_report_draft';
const checkItems = [
  { id: "alcohol", label: "アルコール検知器の使用", on: "使用", off: "未使用" },
  { id: "vehicle", label: "車両異常確認", on: "正常", off: "異常" },
  { id: "condition", label: "体調確認", on: "良好", off: "不調" },
  { id: "drunk", label: "酒気帯びの有無", on: "無", off: "有" },
  { id: "tire", label: "タイヤ（亀裂・空気圧・摩耗）", on: "正常", off: "異常" },
  { id: "light", label: "灯火類（ライト・ウィンカー）", on: "正常", off: "異常" },
  { id: "oil", label: "油脂類（オイル・冷却水等）", on: "正常", off: "異常" }
];

// ページ切り替えと同時にデータを保持
function nextPage() {
  const start = document.getElementById('distStart').value;
  if(!start) { alert("運行前の距離を入力してください"); return; }
  saveDraft();
  updateUI();
  document.getElementById('page1').classList.remove('active');
  document.getElementById('page2').classList.add('active');
  document.querySelector('.id-step2').classList.add('active');
  window.scrollTo(0,0);
}

function prevPage() {
  document.getElementById('page2').classList.remove('active');
  document.getElementById('page1').classList.add('active');
  document.querySelector('.id-step2').classList.remove('active');
  window.scrollTo(0,0);
}

// データの読み込み
function init() {
  const now = new Date();
  document.getElementById('date').value = now.toISOString().split('T')[0];
  document.getElementById('callTime').value = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

  // 点検項目の生成
  const container = document.getElementById('itemsContainer');
  checkItems.forEach(item => {
    container.insertAdjacentHTML('beforeend', `
      <div class="check-item">
        <span class="label-text">${item.label}</span>
        <div style="text-align:right">
          <span class="status-text" id="${item.id}Status">${item.off}</span>
          <label class="switch"><input type="checkbox" id="${item.id}"><span class="slider"></span></label>
        </div>
      </div>`);
    const t = document.getElementById(item.id);
    const s = document.getElementById(item.id+'Status');
    t.addEventListener('change', () => {
      s.textContent = t.checked ? item.on : item.off;
      s.style.color = t.checked ? "#00bcd4" : "#f44336";
      saveDraft();
    });
  });

  // 保存済みデータがあれば復元
  loadDraft();

  // 終了距離入力時に合計を計算
  document.getElementById('distEnd').addEventListener('input', () => {
    calculateTotal();
    saveDraft();
  });
}

function calculateTotal() {
  const s = parseFloat(document.getElementById('distStart').value) || 0;
  const e = parseFloat(document.getElementById('distEnd').value) || 0;
  const total = (e - s > 0) ? (e - s).toFixed(1) : "0.0";
  document.getElementById('distTotal').value = total;
}

// ローカルストレージへの保存
function saveDraft() {
  const draft = {
    date: document.getElementById('date').value,
    distStart: document.getElementById('distStart').value,
    distEnd: document.getElementById('distEnd').value,
    alcValue: document.getElementById('alcValue').value,
    memo: document.getElementById('memo').value,
    checks: {}
  };
  checkItems.forEach(item => {
    draft.checks[item.id] = document.getElementById(item.id).checked;
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
}

// データの復元
function loadDraft() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  const draft = JSON.parse(saved);
  
  if(draft.date) document.getElementById('date').value = draft.date;
  document.getElementById('distStart').value = draft.distStart || "";
  document.getElementById('distEnd').value = draft.distEnd || "";
  document.getElementById('alcValue').value = draft.alcValue || "";
  document.getElementById('memo').value = draft.memo || "";
  
  if(draft.checks) {
    checkItems.forEach(item => {
      const cb = document.getElementById(item.id);
      cb.checked = draft.checks[item.id] || false;
      const s = document.getElementById(item.id+'Status');
      s.textContent = cb.checked ? item.on : item.off;
      s.style.color = cb.checked ? "#00bcd4" : "#f44336";
    });
  }
  updateUI();
  calculateTotal();
}

function updateUI() {
  document.getElementById('displayStart').textContent = document.getElementById('distStart').value || "0";
}

function clearDraft() {
  if(confirm("入力をすべて消去しますか？")) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

// 送信処理
document.getElementById('recordForm').addEventListener('submit', async e => {
  e.preventDefault();
  const submitBtn = e.target.querySelector('.btn-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = "送信中...";

  const data = {
    date: document.getElementById('date').value,
    driver: "屋比久悟",
    carNo: "足立481り9586",
    distStart: document.getElementById('distStart').value,
    distEnd: document.getElementById('distEnd').value,
    distTotal: document.getElementById('distTotal').value,
    callTime: document.getElementById('callTime').value,
    executor: "屋比久悟",
    alcValue: document.getElementById('alcValue').value,
    memo: document.getElementById('memo').value
  };

  const webAppUrl = "https://script.google.com/macros/s/AKfycbx-EtSegrxJq64PcVy3dGqmdtJZ9hAnnswmBTqbTOQolYp7MqbvvUqAEbUyhQ3y7Ctxsg/exec";
  const formData = new URLSearchParams();
  formData.append('contents', JSON.stringify(data));

  try {
    await fetch(webAppUrl, { method: "POST", mode: "no-cors", body: formData });
    alert("一括送信が完了しました！");
    localStorage.removeItem(STORAGE_KEY); // 送信成功したら下書きを消す
    location.reload();
  } catch (err) {
    alert("通信エラーが発生しました。");
    submitBtn.disabled = false;
    submitBtn.textContent = "データを一括送信";
  }
});

window.onload = init;
</script>
</body>
</html>
