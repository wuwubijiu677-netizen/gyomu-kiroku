<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務の記録</title>

<style>
/* ===== 全体 ===== */
body {
  margin: 0;
  background: #eeeeee;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

form {
  max-width: 420px;
  margin: 0 auto;
  background: #ffffff;
  padding: 20px;
  min-height: 100vh;
  box-sizing: border-box;
}

/* ===== ラベル ===== */
label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

/* ===== 入力 ===== */
input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  font-size: 16px;
  box-sizing: border-box;
}

/* ===== トグル共通 ===== */
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
}

.toggle-text {
  font-weight: bold;
}

.toggle input {
  display: none;
}

/* ===== スイッチ本体 ===== */
.slider {
  position: relative;
  width: 64px;
  height: 32px;
  background: #bdbdbd;
  border-radius: 32px;
  cursor: pointer;
  border: 2px solid #666;
  transition: background 0.3s;
}

/* ===== 丸 ===== */
.slider::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  top: 2px;
  left: 2px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  transition: transform 0.3s;
}

/* ===== ON状態 ===== */
input:checked + .slider {
  background: #1565c0;
  border-color: #0d47a1;
}

input:checked + .slider::before {
  transform: translateX(32px);
}

/* ===== ON / OFF 表示 ===== */
.result {
  margin-left: 10px;
  font-weight: bold;
  min-width: 60px;
  text-align: right;
}

.result.on {
  color: #0d47a1;
}

.result.off {
  color: #666;
}

/* ===== 点検 ===== */
fieldset {
  margin-top: 20px;
  padding: 14px;
  background: #f5f7fa;
  border-radius: 8px;
  border: 1px solid #ccc;
}

legend {
  font-weight: bold;
}

/* ===== ボタン ===== */
button {
  margin-top: 30px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: #1976d2;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<form>

<h2 style="text-align:center;">業務の記録</h2>

<label>日付</label>
<input type="date">

<label>点呼時刻</label>
<input type="time">

<!-- 業務前 / 後 -->
<div class="toggle">
  <span class="toggle-text">点呼区分</span>
  <label>
    <input type="checkbox" id="callToggle">
    <span class="slider"></span>
  </label>
  <span id="callResult" class="result off">業務前</span>
</div>

<label>走行距離（前）</label>
<input type="number">

<label>走行距離（後）</label>
<input type="number">

<!-- アルコール -->
<div class="toggle">
  <span class="toggle-text">アルコール</span>
  <label>
    <input type="checkbox" id="alcToggle">
    <span class="slider"></span>
  </label>
  <span id="alcResult" class="result off">未使用</span>
</div>

<label>業務内容</label>
<textarea></textarea>

<!-- 点検 -->
<fieldset>
  <legend>点検項目</legend>
  <label><input type="checkbox"> タイヤ</label>
  <label><input type="checkbox"> 油脂類</label>
  <label><input type="checkbox"> 灯火類</label>
  <label><input type="checkbox"> エンジン</label>
</fieldset>

<button type="button">保存</button>

</form>

<script>
const callToggle = document.getElementById("callToggle");
const callResult = document.getElementById("callResult");

callToggle.onchange = () => {
  if (callToggle.checked) {
    callResult.textContent = "業務後";
    callResult.className = "result on";
  } else {
    callResult.textContent = "業務前";
    callResult.className = "result off";
  }
};

const alcToggle = document.getElementById("alcToggle");
const alcResult = document.getElementById("alcResult");

alcToggle.onchange = () => {
  if (alcToggle.checked) {
    alcResult.textContent = "使用";
    alcResult.className = "result on";
  } else {
    alcResult.textContent = "未使用";
    alcResult.className = "result off";
  }
};
</script>

</body>
</html>
