<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務の記録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    body {
      font-family: system-ui, -apple-system;
      background:#f9f9f9;
      margin:0;
      padding-bottom: 40px;
    }

    form {
      max-width:600px;
      margin:20px auto;
      background:#fff;
      padding:18px;
      border-radius:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }

    label {
      margin-top:15px;
      display:block;
      font-weight:bold;
      font-size:14px;
    }

    .inline-group {
      display:flex;
      gap:10px;
      margin-top: 5px;
    }

    .inline-group div { flex: 1; }

    .inline-group input {
      width:100%;
      height:36px;
      padding:2px 8px;
      font-size:14px;
      border:1px solid #ccc;
      border-radius:6px;
      box-sizing: border-box;
    }

    .hidden { display:none; }

    button {
      width:100%;
      margin-top:30px;
      padding:15px;
      font-size:16px;
      background:#00bcd4;
      color:#fff;
      border:none;
      border-radius:8px;
      cursor: pointer;
      font-weight: bold;
    }

    .check-item {
      padding:10px 0;
      border-bottom:1px solid #eee;
    }

    .right-block {
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
    }

    .row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:100%;
    }

    .label-text {
      font-size:13px;
      color: #333;
      flex: 1;
      padding-right: 10px;
      line-height: 1.4;
    }

    .status-text {
      font-weight:bold;
      font-size:12px;
    }

    /* スイッチ */
    .switch {
      position:relative;
      display:inline-block;
      width:44px;
      height:22px;
      flex-shrink: 0;
    }

    .switch input { display:none; }

    .slider {
      position:absolute;
      cursor:pointer;
      top:0; left:0; right:0; bottom:0;
      background-color:#ccc;
      border-radius:34px;
      transition:.3s;
    }

    .slider:before {
      position:absolute;
      content:"";
      height:18px;
      width:18px;
      left:2px;
      bottom:2px;
      background:white;
      border-radius:50%;
      transition:.3s;
    }

    .switch input:checked + .slider { background-color:#00bcd4; }
    .switch input:checked + .slider:before { transform:translateX(22px); }

    @media (max-width:480px) {
      form { margin: 10px; padding: 12px; }
      .label-text { font-size:12px; }
    }
  </style>
</head>

<body>
<h2 style="text-align:center;">業務の記録</h2>

<form id="form">

  <div class="inline-group">
    <div>
      <label>日付</label>
      <input type="date" id="date" required>
    </div>
    <div>
      <label>点呼時刻</label>
      <input type="time" id="callTime" required>
    </div>
  </div>

  <label>走行距離 (km)</label>
  <div class="inline-group">
    <div><input type="number" id="distanceBefore" placeholder="開始" required></div>
    <div><input type="number" id="distanceAfter" placeholder="終了"></div>
    <div><input type="number" id="totalDistance" placeholder="合計" readonly style="background:#eee;"></div>
  </div>

  <label>点呼区分</label>
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
    <label class="switch">
      <input type="checkbox" id="callTypeToggle">
      <span class="slider"></span>
    </label>
    <span id="callTypeResult" style="font-weight:bold;">業務前</span>
  </div>
  <input type="hidden" id="callTypeHidden" value="業務前">

  <div id="checklistBefore">
    <label style="color:#00bcd4;">点検項目（業務前）</label>
    <div id="itemsBeforeContainer"></div>
  </div>

  <div id="checklistAfter" class="hidden">
    <label style="color:#00bcd4;">点検項目（業務後）</label>
    <div id="itemsAfterContainer"></div>
  </div>

  <button type="submit">保存する</button>

</form>

<script>
// --- 設定：項目リスト ---
const items = [
  { id: "alcohol", label: "アルコール検知器の使用", on: "使用", off: "未使用" },
  { id: "vehicle", label: "車両異常確認", on: "正常", off: "異常" },
  { id: "condition", label: "体調確認", on: "良好", off: "不調" },
  { id: "drunk", label: "酒気帯びの有無", on: "無", off: "有" },
  { id: "license", label: "免許証携帯確認", on: "携帯", off: "不携帯" },
  { id: "tire", label: "タイヤ（亀裂・空気圧・摩耗）", on: "正常", off: "異常" },
  { id: "light", label: "灯火類（方向指示・ライト類）", on: "正常", off: "異常" },
  { id: "oil", label: "油脂類（オイル・冷却水等）", on: "正常", off: "異常" }
];

// --- HTML生成 ---
function createCheckItems(containerId, suffix) {
  const container = document.getElementById(containerId);
  items.forEach(item => {
    const html = `
      <div class="check-item">
        <div class="right-block">
          <span class="status-text" id="${item.id}${suffix}Status">${item.off}</span>
          <div class="row">
            <span class="label-text">${item.label}</span>
            <label class="switch">
              <input type="checkbox" id="${item.id}${suffix}">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>`;
    container.insertAdjacentHTML('beforeend', html);
  });
}

// --- 初期化 ---
window.addEventListener("DOMContentLoaded", () => {
  const now = new Date();
  document.getElementById('date').value = now.toISOString().split('T')[0];
  document.getElementById('callTime').value = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

  // 項目生成
  createCheckItems("itemsBeforeContainer", "Before");
  createCheckItems("itemsAfterContainer", "After");

  // ステータス連動の登録
  items.forEach(item => {
    bindStatus(`${item.id}Before`, `${item.id}BeforeStatus`, item.on, item.off);
    bindStatus(`${item.id}After`, `${item.id}AfterStatus`, item.on, item.off);
  });

  // 距離計算
  const calc = () => {
    const b = parseFloat(document.getElementById('distanceBefore').value) || 0;
    const a = parseFloat(document.getElementById('distanceAfter').value) || 0;
    document.getElementById('totalDistance').value = (a >= b && b > 0) ? (a - b).toFixed(1) : "";
  };
  document.getElementById('distanceBefore').addEventListener("input", calc);
  document.getElementById('distanceAfter').addEventListener("input", calc);

  // 点呼区分切り替え
  document.getElementById('callTypeToggle').addEventListener("change", e => {
    const isAfter = e.target.checked;
    document.getElementById("callTypeResult").textContent = isAfter ? "業務後" : "業務前";
    document.getElementById("callTypeHidden").value = isAfter ? "業務後" : "業務前";
    document.getElementById("checklistBefore").classList.toggle("hidden", isAfter);
    document.getElementById("checklistAfter").classList.toggle("hidden", !isAfter);
  });
});

function bindStatus(toggleId, statusId, onText, offText) {
  const toggle = document.getElementById(toggleId);
  const status = document.getElementById(statusId);
  const update = () => {
    status.textContent = toggle.checked ? onText : offText;
    status.style.color = toggle.checked ? "#00bcd4" : "#f44336";
  };
  toggle.addEventListener("change", update);
  update();
}

// --- 送信 ---
document.getElementById('form').addEventListener("submit", e => {
  e.preventDefault();
  // ここにfetch処理を記述（前回の回答と同様）
  alert("保存しました");
});
</script>
</body>
</html>
