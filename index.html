<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>業務の記録</title>

<style>
/* ===== 全体 ===== */
body {
  margin: 0;
  background: #f2f2f2;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 16px;
  background: #ffffff;
  min-height: 100vh;
}

/* ===== 見出し ===== */
h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== フォーム ===== */
label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  font-size: 16px;
  box-sizing: border-box;
}

/* ===== 業務前 / 業務後 トグル（完全視認版） ===== */
.toggle-area {
  margin: 20px 0;
  text-align: center;
}

.toggle-box {
  display: flex;
  border: 3px solid #999;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.toggle-box div {
  flex: 1;
  padding: 14px 0;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s ease;
}

/* OFF（業務前） */
.toggle-off {
  background: #e0e0e0;
  color: #555;
}

/* ON（業務後） */
.toggle-on {
  background: #0057d9;
  color: #fff;
  box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
}

/* ===== 点検項目 ===== */
.check-group {
  margin-top: 16px;
}

.check-group label {
  font-weight: normal;
  display: block;
}

/* ===== 送信ボタン ===== */
button {
  margin-top: 24px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: #007aff;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">
  <h1>業務の記録</h1>

  <!-- トグル -->
  <div class="toggle-area">
    <div class="toggle-box">
      <div id="beforeBtn" class="toggle-on">業務前</div>
      <div id="afterBtn" class="toggle-off">業務後</div>
    </div>
    <input type="hidden" id="callType" value="業務前">
  </div>

  <!-- フォーム -->
  <label>日付</label>
  <input type="date" id="date">

  <label>点呼時刻</label>
  <input type="time" id="callTime">

  <label>走行距離（前）</label>
  <input type="number" id="distanceBefore">

  <label>走行距離（後）</label>
  <input type="number" id="distanceAfter">

  <label>アルコール</label>
  <select id="alcohol">
    <option value="異常なし">異常なし</option>
    <option value="検知あり">検知あり</option>
  </select>

  <label>健康状態</label>
  <select id="health">
    <option value="良好">良好</option>
    <option value="注意">注意</option>
  </select>

  <label>業務内容</label>
  <textarea id="workType"></textarea>

  <div class="check-group">
    <label><input type="checkbox" id="tire"> タイヤ</label>
    <label><input type="checkbox" id="oil"> 油脂類</label>
    <label><input type="checkbox" id="lamp"> 灯火類</label>
    <label><input type="checkbox" id="engine"> エンジン</label>
  </div>

  <button onclick="submitData()">保存</button>
</div>

<script>
/* ===== トグル制御 ===== */
const beforeBtn = document.getElementById("beforeBtn");
const afterBtn  = document.getElementById("afterBtn");
const callType  = document.getElementById("callType");

beforeBtn.onclick = () => {
  beforeBtn.className = "toggle-on";
  afterBtn.className  = "toggle-off";
  callType.value = "業務前";
};

afterBtn.onclick = () => {
  beforeBtn.className = "toggle-off";
  afterBtn.className  = "toggle-on";
  callType.value = "業務後";
};

/* ===== 送信（今は確認用） ===== */
function submitData() {
  alert("入力OK（保存処理は次）");
}
</script>
</body>
</html>
