<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務の記録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    body {
      font-family: system-ui, -apple-system;
      background:#f9f9f9;
      margin:0;
    }

    form {
      max-width:600px;
      margin:30px auto;
      background:#fff;
      padding:18px;
      border-radius:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }

    label {
      margin-top:8px;
      display:block;
      font-weight:bold;
      font-size:14px;
    }

    .inline-group {
      display:flex;
      gap:12px;
    }

    .inline-group input {
      width:100%;
      height:28px;
      padding:2px 4px;
      font-size:14px;
      border:1px solid #ccc;
      border-radius:6px;
    }

    .hidden { display:none; }

    button {
      width:100%;
      margin-top:20px;
      padding:12px;
      font-size:16px;
      background:#00bcd4;
      color:#fff;
      border:none;
      border-radius:8px;
    }

    .check-item {
      padding:6px 0;
      border-bottom:1px solid #eee;
    }

    .right-block {
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:2px;
    }

    .row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:100%;
      margin:0;
    }

    .label-text {
      font-size:13px;
    }

    .status-text {
      font-weight:bold;
      font-size:12px;
    }

    .switch {
      position:relative;
      display:inline-block;
      width:40px;
      height:20px;
    }

    .switch input { display:none; }

    .slider {
      position:absolute;
      cursor:pointer;
      top:0; left:0; right:0; bottom:0;
      background-color:#ccc;
      border-radius:34px;
      transition:.3s;
    }

    .slider:before {
      position:absolute;
      content:"";
      height:16px;
      width:16px;
      left:2px;
      bottom:2px;
      background:white;
      border-radius:50%;
      transition:.3s;
    }

    .switch input:checked + .slider {
      background-color:#00bcd4;
    }

    .switch input:checked + .slider:before {
      transform:translateX(20px);
    }

    @media (max-width:480px) {
      .label-text { font-size:12px; }
      .status-text { font-size:11px; }
      .switch { width:36px; height:18px; }
      .slider:before { height:14px; width:14px; }
      .switch input:checked + .slider:before {
        transform:translateX(18px);
      }
    }
  </style>
</head>

<body onload="init()">
<h2 style="text-align:center;">業務の記録</h2>

<form id="form">

  <div class="inline-group">
    <div style="flex:1;">
      <label>日付</label>
      <input type="date" id="date" required>
    </div>

    <div style="flex:1;">
      <label>点呼時刻</label>
      <input type="time" id="callTime" required>
    </div>
  </div>

  <label>点呼区分</label>
  <div style="display:flex; align-items:center; gap:10px;">
    <label class="switch">
      <input type="checkbox" id="callTypeToggle">
      <span class="slider"></span>
    </label>
    <span id="callTypeResult" style="font-weight:bold;">業務前</span>
  </div>

  <input type="hidden" id="callTypeHidden" value="業務前">

  <div id="checklistBefore">
    <label>点検項目（業務前）</label>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="alcoholBeforeStatus">使用</span>
        <div class="row">
          <span class="label-text">アルコール検知器の使用の有無</span>
          <label class="switch">
            <input type="checkbox" id="alcoholBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="vehicleBeforeStatus">正常</span>
        <div class="row">
          <span class="label-text">車両異常確認</span>
          <label class="switch">
            <input type="checkbox" id="vehicleBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="conditionBeforeStatus">良好</span>
        <div class="row">
          <span class="label-text">体調確認</span>
          <label class="switch">
            <input type="checkbox" id="conditionBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="drunkBeforeStatus">無</span>
        <div class="row">
          <span class="label-text">酒気帯びの有無</span>
          <label class="switch">
            <input type="checkbox" id="drunkBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="licenseBeforeStatus">携帯</span>
        <div class="row">
          <span class="label-text">免許証携帯確認</span>
          <label class="switch">
            <input type="checkbox" id="licenseBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="tireBeforeStatus">正常</span>
        <div class="row">
          <span class="label-text">タイヤ（亀裂・空気圧・摩耗）</span>
          <label class="switch">
            <input type="checkbox" id="tireBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="lightBeforeStatus">正常</span>
        <div class="row">
          <span class="label-text">灯火類（方向指示器・前照灯・車幅灯・制動灯）</span>
          <label class="switch">
            <input type="checkbox" id="lightBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="oilBeforeStatus">正常</span>
        <div class="row">
          <span class="label-text">油脂類（エンジン・ミッション・パワステ・ブレーキ・冷却水）</span>
          <label class="switch">
            <input type="checkbox" id="oilBefore">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

  </div>

  <div id="checklistAfter" class="hidden">
    <label>点検項目（業務後）</label>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="alcoholAfterStatus">使用</span>
        <div class="row">
          <span class="label-text">アルコール検知器の使用の有無</span>
          <label class="switch">
            <input type="checkbox" id="alcoholAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="vehicleAfterStatus">正常</span>
        <div class="row">
          <span class="label-text">車両異常確認</span>
          <label class="switch">
            <input type="checkbox" id="vehicleAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="conditionAfterStatus">良好</span>
        <div class="row">
          <span class="label-text">体調確認</span>
          <label class="switch">
            <input type="checkbox" id="conditionAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="drunkAfterStatus">無</span>
        <div class="row">
          <span class="label-text">酒気帯びの有無</span>
          <label class="switch">
            <input type="checkbox" id="drunkAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="licenseAfterStatus">携帯</span>
        <div class="row">
          <span class="label-text">免許証携帯確認</span>
          <label class="switch">
            <input type="checkbox" id="licenseAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="tireAfterStatus">正常</span>
        <div class="row">
          <span class="label-text">タイヤ（亀裂・空気圧・摩耗）</span>
          <label class="switch">
            <input type="checkbox" id="tireAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="lightAfterStatus">正常</span>
        <div class="row">
          <span class="label-text">灯火類（方向指示器・前照灯・車幅灯・制動灯）</span>
          <label class="switch">
            <input type="checkbox" id="lightAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="check-item">
      <div class="right-block">
        <span class="status-text" id="oilAfterStatus">正常</span>
        <div class="row">
          <span class="label-text">油脂類（エンジン・ミッション・パワステ・ブレーキ・冷却水）</span>
          <label class="switch">
            <input type="checkbox" id="oilAfter">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

  </div>

  <script>
function init() {
  const now = new Date();
  date.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  callTime.value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

function calcTotal() {
  const before = Number(distanceBefore.value);
  const after = Number(distanceAfter.value);

  if (!isNaN(before) && !isNaN(after) && after >= before) {
    totalDistance.value = after - before;
  } else {
    totalDistance.value = "";
  }
}

distanceBefore.addEventListener("input", calcTotal);
distanceAfter.addEventListener("input", calcTotal);

callTypeToggle.addEventListener("change", e => {
  const after = e.target.checked;

  callTypeResult.textContent = after ? "業務後" : "業務前";
  callTypeHidden.value = after ? "業務後" : "業務前";

  checklistBefore.classList.toggle("hidden", after);
  checklistAfter.classList.toggle("hidden", !after);
});

function bindStatus(toggleId, statusId, onText, offText) {
  document.getElementById(toggleId).addEventListener("change", e => {
    document.getElementById(statusId).textContent =
      e.target.checked ? onText : offText;
  });
}
bindStatus("alcoholBefore", "alcoholBeforeStatus", "使用", "未使用");
bindStatus("vehicleBefore", "vehicleBeforeStatus", "正常", "異常");
bindStatus("conditionBefore", "conditionBeforeStatus", "良好", "不調");
bindStatus("drunkBefore", "drunkBeforeStatus", "無", "有");
bindStatus("licenseBefore", "licenseBeforeStatus", "携帯", "不携帯");
bindStatus("tireBefore", "tireBeforeStatus", "正常", "異常");
bindStatus("lightBefore", "lightBeforeStatus", "正常", "異常");
bindStatus("oilBefore", "oilBeforeStatus", "正常", "異常");

bindStatus("alcoholAfter", "alcoholAfterStatus", "使用", "未使用");
bindStatus("vehicleAfter", "vehicleAfterStatus", "正常", "異常");
bindStatus("conditionAfter", "conditionAfterStatus", "良好", "不調");
bindStatus("drunkAfter", "drunkAfterStatus", "無", "有");
bindStatus("licenseAfter", "licenseAfterStatus", "携帯", "不携帯");
bindStatus("tireAfter", "tireAfterStatus", "正常", "異常");
bindStatus("lightAfter", "lightAfterStatus", "正常", "異常");
bindStatus("oilAfter", "oilAfterStatus", "正常", "異常");

form.addEventListener("submit", e => {
  e.preventDefault();

  const checklist = {
    alcoholBefore: alcoholBeforeStatus.textContent,
    vehicleBefore: vehicleBeforeStatus.textContent,
    conditionBefore: conditionBeforeStatus.textContent,
    drunkBefore: drunkBeforeStatus.textContent,
    licenseBefore: licenseBeforeStatus.textContent,
    tireBefore: tireBeforeStatus.textContent,
    lightBefore: lightBeforeStatus.textContent,
    oilBefore: oilBeforeStatus.textContent,

    alcoholAfter: alcoholAfterStatus.textContent,
    vehicleAfter: vehicleAfterStatus.textContent,
    conditionAfter: conditionAfterStatus.textContent,
    drunkAfter: drunkAfterStatus.textContent,
    licenseAfter: licenseAfterStatus.textContent,
    tireAfter: tireAfterStatus.textContent,
    lightAfter: lightAfterStatus.textContent,
    oilAfter: oilAfterStatus.textContent
  };

  const data = {
    date: date.value,
    callType: callTypeHidden.value,
    callTime: callTime.value,
    distanceBefore: distanceBefore.value,
    distanceAfter: distanceAfter.value,
    totalDistance: totalDistance.value,
    checklist: checklist
  };

  fetch("GAS_WEBAPP_URL", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(data)
  })
  .then(r => r.json())
  .then(() => {
    alert("保存しました");
    form.reset();
    init();
  })
  .catch(() => alert("保存失敗"));
});
</script>

</form>
</body>
  <script>
// ===============================
// 要素取得（存在しない場合もあるので安全に）
// ===============================
const statusSelect = document.getElementById("status");
const statusDisplay = document.getElementById("statusDisplay");

const categorySelect = document.getElementById("category");
const categoryDisplay = document.getElementById("categoryDisplay");

const distanceBefore = document.getElementById("distanceBefore");
const distanceAfter = document.getElementById("distanceAfter");
const distanceTotal = document.getElementById("distanceTotal");

// ===============================
// ステータス切替（存在する場合のみ）
// ===============================
if (statusSelect && statusDisplay) {
  statusSelect.addEventListener("change", () => {
    statusDisplay.textContent = statusSelect.value;
  });
}

// ===============================
// 点呼区分切替（存在する場合のみ）
// ===============================
if (categorySelect && categoryDisplay) {
  categorySelect.addEventListener("change", () => {
    categoryDisplay.textContent = categorySelect.value;
  });
}

// ===============================
// 距離計算（存在する場合のみ）
// ===============================
function calcTotal() {
  if (!distanceBefore || !distanceAfter || !distanceTotal) return;

  const before = Number(distanceBefore.value);
  const after = Number(distanceAfter.value);

  if (!isNaN(before) && !isNaN(after)) {
    distanceTotal.value = after - before;
  }
}

if (distanceBefore) {
  distanceBefore.addEventListener("input", calcTotal);
}
if (distanceAfter) {
  distanceAfter.addEventListener("input", calcTotal);
}

// ===============================
// トグルスイッチ（存在する場合のみ）
// ===============================
document.querySelectorAll(".toggle-input").forEach(toggle => {
  toggle.addEventListener("change", () => {
    const targetId = toggle.dataset.target;
    const target = document.getElementById(targetId);
    if (target) {
      target.textContent = toggle.checked ? "済" : "未";
    }
  });
});
</script>

</html>
