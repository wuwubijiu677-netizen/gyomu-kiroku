<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務の記録</title>

<style>
body {
  font-family: system-ui, -apple-system;
  background: #e5e9f0;
  margin: 0;
  padding: 12px;
}

h1 {
  text-align: center;
  margin-bottom: 16px;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #bbb;
}

.inline {
  display: flex;
  gap: 12px;
}

.inline > div {
  flex: 1;
}

/* ===== トグル ===== */
.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toggle-text {
  font-weight: bold;
}

.toggle input {
  display: none;
}

.slider {
  width: 60px;
  height: 30px;
  background: #666;
  border-radius: 15px;
  position: relative;
  cursor: pointer;
}

.slider::before {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  top: 3px;
  left: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background: #2e7d32;
}

input:checked + .slider::before {
  transform: translateX(30px);
}

/* ===== 点検 ===== */
.checklist label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

/* ===== ボタン ===== */
button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  background: #1976d2;
  color: #fff;
  border: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>業務の記録</h1>

<div class="card">
  <label>日付</label>
  <input type="date" id="date">
</div>

<div class="card inline">
  <div>
    <label>点呼時刻</label>
    <input type="time" id="callTime">
  </div>
  <div>
    <label>点呼区分</label>
    <div class="toggle-row">
      <span id="callTypeText" class="toggle-text">業務前</span>
      <label class="toggle">
        <input type="checkbox" id="callType">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div class="card">
  <label>走行距離（運行前）km</label>
  <input type="number" id="beforeKm">
</div>

<div class="card">
  <label>走行距離（運行後）km</label>
  <input type="number" id="afterKm">
</div>

<div class="card">
  <label>当日の総走行距離 km</label>
  <input type="number" id="totalKm" readonly>
</div>

<div class="card">
  <label>アルコール検知器</label>
  <div class="toggle-row">
    <span id="alcoholText">未使用</span>
    <label class="toggle">
      <input type="checkbox" id="alcohol">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="card">
  <label>健康状態</label>
  <div class="toggle-row">
    <span id="healthText">未確認</span>
    <label class="toggle">
      <input type="checkbox" id="health">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="card">
  <label>業務内容</label>
  <textarea id="workType"></textarea>
</div>

<div class="card checklist">
  <label>点検項目</label>
  <label><input type="checkbox" id="tire"> タイヤ</label>
  <label><input type="checkbox" id="oil"> 油脂類</label>
  <label><input type="checkbox" id="lamp"> 灯火類</label>
  <label><input type="checkbox" id="engine"> エンジン</label>
</div>

<button>保存（次でGAS接続）</button>

<script>
/* ===== 初期値 ===== */
const now = new Date();
date.value = now.toISOString().slice(0,10);
callTime.value = now.toTimeString().slice(0,5);

/* ===== 点呼区分 ===== */
callType.onchange = () => {
  callTypeText.textContent = callType.checked ? "業務後" : "業務前";
};

/* ===== 距離計算 ===== */
function calcKm() {
  const b = Number(beforeKm.value);
  const a = Number(afterKm.value);
  totalKm.value = (!isNaN(b) && !isNaN(a) && a >= b) ? a - b : "";
}
beforeKm.oninput = afterKm.oninput = calcKm;

/* ===== アルコール ===== */
alcohol.onchange = () => {
  alcoholText.textContent = alcohol.checked ? "使用" : "未使用";
};

/* ===== 健康 ===== */
health.onchange = () => {
  healthText.textContent = health.checked ? "良好" : "未確認";
};
</script>

</body>
</html>
