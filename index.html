<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>業務の記録</title>

<style>
/* ===== 全体 ===== */
body {
  margin: 0;
  background: #f0f0f0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* ===== フォーム（レイアウト変更なし） ===== */
form {
  max-width: 420px;
  margin: 0 auto;
  background: #ffffff;
  min-height: 100vh;
  box-sizing: border-box;
  padding-bottom: 24px;
}

/* ===== タイトル帯（★白→黒に変更した唯一の箇所） ===== */
h2 {
  margin: 0;
  padding: 14px 0;
  text-align: center;
  background: #000000;   /* ← ここだけ変更 */
  color: #ffffff;
  font-size: 20px;
}

/* ===== ラベル ===== */
label {
  display: block;
  margin: 16px 16px 6px;
  font-weight: bold;
}

/* ===== 入力 ===== */
input, textarea {
  width: calc(100% - 32px);
  margin: 0 16px;
  padding: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

/* ===== トグル ===== */
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 16px;
}

.toggle span {
  font-weight: bold;
}

.toggle input {
  display: none;
}

.slider {
  width: 60px;
  height: 30px;
  background: #cccccc;
  border-radius: 30px;
  position: relative;
  border: 2px solid #666;
  cursor: pointer;
}

.slider::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  top: 2px;
  left: 2px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
  transition: transform 0.3s;
}

input:checked + .slider {
  background: #1565c0;
  border-color: #0d47a1;
}

input:checked + .slider::before {
  transform: translateX(30px);
}

.result {
  min-width: 64px;
  text-align: right;
  font-weight: bold;
}

.result.off {
  color: #666;
}

.result.on {
  color: #0d47a1;
}

/* ===== 点検 ===== */
fieldset {
  margin: 20px 16px;
  padding: 12px;
  background: #f5f7fa;
  border-radius: 8px;
  border: 1px solid #ccc;
}

legend {
  font-weight: bold;
}

/* ===== ボタン ===== */
button {
  margin: 30px 16px 0;
  width: calc(100% - 32px);
  padding: 14px;
  font-size: 18px;
  background: #1976d2;
  color: #ffffff;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<form>

<h2>業務の記録</h2>

<label>日付</label>
<input type="date">

<label>点呼時刻</label>
<input type="time">

<div class="toggle">
  <span>点呼区分</span>
  <label>
    <input type="checkbox" id="callToggle">
    <span class="slider"></span>
  </label>
  <span id="callResult" class="result off">業務前</span>
</div>

<label>走行距離（運行前）</label>
<input type="number">

<label>走行距離（運行後）</label>
<input type="number">

<div class="toggle">
  <span>アルコール</span>
  <label>
    <input type="checkbox" id="alcToggle">
    <span class="slider"></span>
  </label>
  <span id="alcResult" class="result off">未使用</span>
</div>

<label>業務内容</label>
<textarea rows="3"></textarea>

<fieldset>
  <legend>点検項目</legend>
  <label><input type="checkbox"> タイヤ</label>
  <label><input type="checkbox"> 油脂類</label>
  <label><input type="checkbox"> 灯火類</label>
  <label><input type="checkbox"> エンジン</label>
</fieldset>

<button type="button">保存</button>

</form>

<script>
const callToggle = document.getElementById("callToggle");
const callResult = document.getElementById("callResult");

callToggle.onchange = () => {
  if (callToggle.checked) {
    callResult.textContent = "業務後";
    callResult.className = "result on";
  } else {
    callResult.textContent = "業務前";
    callResult.className = "result off";
  }
};

const alcToggle = document.getElementById("alcToggle");
const alcResult = document.getElementById("alcResult");

alcToggle.onchange = () => {
  if (alcToggle.checked) {
    alcResult.textContent = "使用";
    alcResult.className = "result on";
  } else {
    alcResult.textContent = "未使用";
    alcResult.className = "result off";
  }
};
</script>

</body>
</html>
