<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>業務の記録</title>

<style>
/* ===== 外側（白） ===== */
body {
  margin: 0;
  background: #ffffff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* ===== 内側フォーム（黒） ===== */
form {
  max-width: 420px;
  margin: 0 auto;
  background: #000000;
  min-height: 100vh;
  box-sizing: border-box;
  padding-bottom: 24px;
}

/* ===== タイトル ===== */
h2 {
  margin: 0;
  padding: 14px 0;
  text-align: center;
  background: #000000;
  color: #ffffff;
  font-size: 20px;
  border-bottom: 1px solid #333;
}

/* ===== ラベル ===== */
label, legend {
  display: block;
  margin: 16px 16px 6px;
  font-weight: bold;
  color: #ffffff;
}

/* ===== 入力 ===== */
input, textarea {
  width: calc(100% - 32px);
  margin: 0 16px;
  padding: 10px;
  font-size: 16px;
  box-sizing: border-box;
  background: #ffffff;
  color: #000000;
  border-radius: 4px;
  border: none;
}

/* ===== トグル ===== */
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 16px;
  color: #ffffff;
}
/* ===== トグル ON / OFF 視認性強化（レイアウト不変更） ===== */

.slider {
  background: #ffffff;
  border: 2px solid #999;
}

.slider::before {
  background: #cccccc;
}

/* ON 状態 */
input:checked + .slider {
  background: #ffffff;
  border-color: #00e5ff;
}

input:checked + .slider::before {
  background: #00e5ff;
  transform: translateX(30px);
}

.result-text {
  font-weight: bold;
}

.toggle input {
  display: none;
}

.slider {
  width: 60px;
  height: 30px;
  background: #666;
  border-radius: 30px;
  position: relative;
  border: 2px solid #888;
  cursor: pointer;
}

.slider::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  top: 2px;
  left: 2px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  transition: transform 0.3s;
}

input:checked + .slider {
  background: #1976d2;
  border-color: #0d47a1;
}

input:checked + .slider::before {
  transform: translateX(30px);
}

/* ★ ON / OFF 文字はどちらも白 */
.result {
  min-width: 64px;
  text-align: right;
  font-weight: bold;
  color: #ffffff;
}

/* ===== 点検 ===== */
fieldset {
  margin: 20px 16px;
  padding: 12px;
  background: #111;
  border-radius: 8px;
  border: 1px solid #333;
}

fieldset label {
  margin: 6px 0;
  color: #ffffff;
}

/* ===== ボタン ===== */
button {
  margin: 30px 16px 0;
  width: calc(100% - 32px);
  padding: 14px;
  font-size: 18px;
  background: #1976d2;
  color: #ffffff;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<form>

<h2>業務の記録</h2>

<label>日付</label>
<input type="date" id="dateInput">

<label>点呼時刻</label>
<input type="time" id="timeInput">

<div class="toggle">
  <span>点呼区分</span>
  <label>
    <input type="checkbox" id="callToggle">
    <span class="slider"></span>
  </label>
  <span id="callResult" class="result">業務前</span>
</div>

<label>走行距離（運行前）</label>
<input type="number">

<label>走行距離（運行後）</label>
<input type="number">

<div class="toggle">
  <span>アルコール</span>
  <label>
    <input type="checkbox" id="alcToggle">
    <span class="slider"></span>
  </label>
  <span id="alcResult" class="result">未使用</span>
</div>

<label>業務内容</label>
<textarea rows="3"></textarea>

<fieldset>
  <legend>点検項目</legend>
  <label><input type="checkbox"> タイヤ</label>
  <label><input type="checkbox"> 油脂類</label>
  <label><input type="checkbox"> 灯火類</label>
  <label><input type="checkbox"> エンジン</label>
</fieldset>

<button type="button">保存</button>

</form>

<script>
/* ===== 日付・時刻 自動入力 ===== */
window.addEventListener("load", () => {
  const now = new Date();

  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  const hh = String(now.getHours()).padStart(2, "0");
  const min = String(now.getMinutes()).padStart(2, "0");

  document.getElementById("dateInput").value = `${yyyy}-${mm}-${dd}`;
  document.getElementById("timeInput").value = `${hh}:${min}`;
});

/* ===== トグル動作 ===== */
const callToggle = document.getElementById("callToggle");
const callResult = document.getElementById("callResult");

callToggle.onchange = () => {
  callResult.textContent = callToggle.checked ? "業務後" : "業務前";
};

const alcToggle = document.getElementById("alcToggle");
const alcResult = document.getElementById("alcResult");

alcToggle.onchange = () => {
  alcResult.textContent = alcToggle.checked ? "使用" : "未使用";
};
</script>

</body>
</html>
