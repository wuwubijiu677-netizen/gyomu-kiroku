<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務記録システム（日またぎ自動判定版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { --primary: #00bcd4; --bg: #f5f7f8; --text: #333; }
    body { font-family: system-ui, -apple-system; background: var(--bg); margin: 0; color: var(--text); padding-bottom: 40px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--primary); color: #fff; padding: 20px; text-align: center; }
    .step-bar { display: flex; background: #e0f7fa; padding: 10px 0; border-bottom: 1px solid #b2ebf2; }
    .step { flex: 1; text-align: center; font-size: 12px; color: #888; font-weight: bold; }
    .step.active { color: var(--primary); }
    form { padding: 20px; flex: 1; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    label { display: block; margin-top: 18px; font-weight: bold; font-size: 14px; }
    .field-group { display: flex; gap: 10px; }
    .field-group > div { flex: 1; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .readonly-field { background: #f0f0f0; color: #666; }
    .check-list-container { margin-top: 15px; border-top: 2px solid var(--primary); padding-top: 10px; }
    .check-item { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .status-text { font-size: 11px; font-weight: bold; color: #f44336; margin-bottom: 4px; display: block; text-align: right; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { display: none; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 34px; transition: .3s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background: var(--primary); }
    input:checked + .slider:before { transform: translateX(24px); }
    .btn-group { margin-top: 35px; display: flex; gap: 12px; }
    button { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-next { background: var(--primary); color: #fff; }
    .btn-submit { background: #4caf50; color: #fff; }
    .btn-clear { background: #ff5252; color: #fff; font-size: 11px; padding: 8px; margin-top: 20px; border-radius: 8px; border:none; width:100%; }
  </style>
</head>
<body>

<div class="container">
  <div class="header"><h2>業務記録（屋比久 悟）</h2></div>
  <div class="step-bar">
    <div class="step id-step1 active">1. 運行前入力</div>
    <div class="step id-step2">2. 運行後入力・一括送信</div>
  </div>

  <form id="recordForm">
    <div id="page1" class="page active">
      <div class="field-group">
        <div><label>運行前日付</label><input type="date" id="dateBefore" required></div>
        <div><label>開始時間</label><input type="time" id="startTime" required></div>
      </div>
      
      <div class="field-group">
        <div><label>点呼方法</label><select id="methodBefore"><option>対面</option><option>電話</option><option>IT点呼</option></select></div>
        <div><label>執行者</label><input type="text" value="屋比久悟" class="readonly-field" readonly></div>
      </div>

      <label>走行距離計（運行前） [km]</label>
      <input type="number" id="distStart" placeholder="開始距離" step="0.1" required>

      <label>アルコールチェック（運行前） [mg/L]</label>
      <input type="number" id="alcBefore" placeholder="0.00" step="0.01">

      <div class="check-list-container">
        <label style="color:var(--primary);">▼ 運行前 点検項目</label>
        <div id="itemsBeforeContainer"></div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-next" onclick="nextPage()">次へ（運行後入力へ） ＞</button>
      </div>
    </div>

    <div id="page2" class="page">
      <div class="field-group">
        <div><label>運行後日付</label><input type="date" id="dateAfter" required></div>
        <div><label>完了時間</label><input type="time" id="endTime" required></div>
      </div>

      <div class="field-group">
        <div><label>点呼方法</label><select id="methodAfter"><option>対面</option><option>電話</option><option>IT点呼</option></select></div>
        <div><label>執行者</label><input type="text" value="屋比久悟" class="readonly-field" readonly></div>
      </div>

      <div class="field-group">
        <div><label>走行距離（後）</label><input type="number" id="distEnd" placeholder="終了距離" step="0.1" required></div>
        <div><label>総走行距離</label><input type="text" id="distTotal" class="readonly-field" readonly></div>
      </div>

      <label>アルコールチェック（運行後） [mg/L]</label>
      <input type="number" id="alcAfter" placeholder="0.00" step="0.01">

      <div class="check-list-container">
        <label style="color:var(--primary);">▼ 運行後 点検項目</label>
        <div id="itemsAfterContainer"></div>
      </div>

      <label>特記事項</label>
      <textarea id="memo" placeholder="異常や連絡事項があれば記入" rows="3"></textarea>

      <div class="btn-group">
        <button type="button" onclick="prevPage()">戻る</button>
        <button type="submit" class="btn-submit">全データを一括送信</button>
      </div>
      <button type="button" class="btn-clear" onclick="clearDraft()">下書きをリセット</button>
    </div>
  </form>
</div>

<script>
const STORAGE_KEY = 'daily_report_final_v1';
const checkItems = [
  { id: "alcohol", label: "アルコール検知器使用", on: "使用", off: "未使用" },
  { id: "vehicle", label: "車両異常確認", on: "正常", off: "異常" },
  { id: "condition", label: "体調確認", on: "良好", off: "不調" },
  { id: "drunk", label: "酒気帯び有無", on: "無", off: "有" },
  { id: "tire", label: "タイヤ点検", on: "正常", off: "異常" },
  { id: "light", label: "灯火類点検", on: "正常", off: "異常" },
  { id: "oil", label: "油脂類点検", on: "正常", off: "異常" }
];

// 初期化処理
function init() {
  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

  // デフォルト値のセット
  document.getElementById('dateBefore').value = dateStr;
  document.getElementById('startTime').value = timeStr;
  document.getElementById('dateAfter').value = dateStr;
  document.getElementById('endTime').value = timeStr;

  // 深夜（0時〜5時）判定
  if (now.getHours() < 5) {
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    document.getElementById('dateBefore').value = yesterday.toISOString().split('T')[0];
  }

  renderItems("itemsBeforeContainer", "Before");
  renderItems("itemsAfterContainer", "After");

  loadDraft();

  const inputs = ['dateBefore', 'dateAfter', 'distStart', 'distEnd', 'alcBefore', 'alcAfter', 'startTime', 'endTime', 'methodBefore', 'methodAfter', 'memo'];
  inputs.forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      if (id.includes('dist')) calculateTotal();
      saveDraft();
    });
  });
}

function nextPage() {
  if (!document.getElementById('distStart').value) { alert("運行前の距離を入力してください"); return; }
  
  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

  // STEP2に移動する瞬間に運行後日付を「現在」に自動更新
  document.getElementById('dateAfter').value = dateStr;
  document.getElementById('endTime').value = timeStr;

  saveDraft();
  document.getElementById('page1').classList.remove('active');
  document.getElementById('page2').classList.add('active');
  document.querySelector('.id-step2').classList.add('active');
  window.scrollTo(0, 0);
}

function prevPage() {
  document.getElementById('page2').classList.remove('active');
  document.getElementById('page1').classList.add('active');
  document.querySelector('.id-step2').classList.remove('active');
  window.scrollTo(0, 0);
}

function renderItems(containerId, suffix) {
  const container = document.getElementById(containerId);
  checkItems.forEach(item => {
    const inputId = item.id + suffix;
    const statusId = inputId + "Status";
    container.insertAdjacentHTML('beforeend', `
      <div class="check-item">
        <span class="label-text">${item.label}</span>
        <div>
          <span class="status-text" id="${statusId}">${item.off}</span>
          <label class="switch"><input type="checkbox" id="${inputId}"><span class="slider"></span></label>
        </div>
      </div>`);
    document.getElementById(inputId).addEventListener('change', (e) => {
      const s = document.getElementById(statusId);
      s.textContent = e.target.checked ? item.on : item.off;
      s.style.color = e.target.checked ? "#00bcd4" : "#f44336";
      saveDraft();
    });
  });
}

function calculateTotal() {
  const s = parseFloat(document.getElementById('distStart').value) || 0;
  const e = parseFloat(document.getElementById('distEnd').value) || 0;
  document.getElementById('distTotal').value = (e - s > 0) ? (e - s).toFixed(1) : "0.0";
}

function saveDraft() {
  const draft = {
    dateBefore: document.getElementById('dateBefore').value,
    dateAfter: document.getElementById('dateAfter').value,
    startTime: document.getElementById('startTime').value,
    endTime: document.getElementById('endTime').value,
    methodBefore: document.getElementById('methodBefore').value,
    methodAfter: document.getElementById('methodAfter').value,
    distStart: document.getElementById('distStart').value,
    distEnd: document.getElementById('distEnd').value,
    alcBefore: document.getElementById('alcBefore').value,
    alcAfter: document.getElementById('alcAfter').value,
    memo: document.getElementById('memo').value,
    checks: {}
  };
  checkItems.forEach(item => {
    draft.checks[item.id + "Before"] = document.getElementById(item.id + "Before").checked;
    draft.checks[item.id + "After"] = document.getElementById(item.id + "After").checked;
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
}

function loadDraft() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  const draft = JSON.parse(saved);
  Object.keys(draft).forEach(key => {
    if (key !== 'checks' && document.getElementById(key)) document.getElementById(key).value = draft[key];
  });
  checkItems.forEach(item => {
    ["Before", "After"].forEach(suffix => {
      const id = item.id + suffix;
      const cb = document.getElementById(id);
      if (draft.checks && draft.checks[id] !== undefined) {
        cb.checked = draft.checks[id];
        const s = document.getElementById(id + "Status");
        s.textContent = cb.checked ? item.on : item.off;
        s.style.color = cb.checked ? "#00bcd4" : "#f44336";
      }
    });
  });
  calculateTotal();
}

function clearDraft() {
  if (confirm("下書きをすべて消去しますか？")) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
}

document.getElementById('recordForm').addEventListener('submit', async e => {
  e.preventDefault();
  const submitBtn = e.target.querySelector('.btn-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = "送信中...";

  const data = {
    dateBefore: document.getElementById('dateBefore').value,
    startTime: document.getElementById('startTime').value,
    methodBefore: document.getElementById('methodBefore').value,
    distStart: document.getElementById('distStart').value,
    alcBefore: document.getElementById('alcBefore').value,
    dateAfter: document.getElementById('dateAfter').value,
    endTime: document.getElementById('endTime').value,
    methodAfter: document.getElementById('methodAfter').value,
    distEnd: document.getElementById('distEnd').value,
    distTotal: document.getElementById('distTotal').value,
    alcAfter: document.getElementById('alcAfter').value,
    memo: document.getElementById('memo').value,
    driver: "屋比久悟",
    carNo: "足立481り9586"
  };

  const webAppUrl = "https://script.google.com/macros/s/AKfycbx-EtSegrxJq64PcVy3dGqmdtJZ9hAnnswmBTqbTOQolYp7MqbvvUqAEbUyhQ3y7Ctxsg/exec";
  const formData = new URLSearchParams();
  formData.append('contents', JSON.stringify(data));

  try {
    await fetch(webAppUrl, { method: "POST", mode: "no-cors", body: formData });
    alert("一括送信が完了しました！お疲れ様でした。");
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  } catch (err) {
    alert("通信エラー。設定やURLを確認してください。");
    submitBtn.disabled = false;
    submitBtn.textContent = "全データを一括送信";
  }
});

window.onload = init;
</script>
</body>
</html>
