<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務の記録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    body { font-family: system-ui,-apple-system; background:#f9f9f9; margin:0; }
    form { max-width:600px; margin:40px auto; background:#fff; padding:24px;
           border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.1); }

    label { margin-top:16px; display:block; font-weight:bold; }

    .inline-group {
      display:flex;
      gap:24px;
    }
    .inline-group input {
      width:85%;
      height:32px;
      padding:4px 6px;
      font-size:16px;
    }

    .distance-box {
      width:120px;
      height:32px;
      padding:4px 6px;
      font-size:16px;
    }

    .km-label {
      margin-left:6px;
      font-weight:bold;
    }

    .hidden { display:none; }

    button {
      width:100%; margin-top:24px; padding:14px; font-size:18px;
      background:#00bcd4; color:#fff; border:none; border-radius:8px;
    }

    .check-item {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 0;
      font-size:16px;
    }

    /* ★ 左寄せ（中央寄り）にするトグルだけ margin-right を追加 */
    #vehicleBefore + .slider,
    #vehicleAfter + .slider,
    #conditionBefore + .slider,
    #conditionAfter + .slider,
    #drunkBefore + .slider,
    #drunkAfter + .slider,
    #tireBefore + .slider,
    #tireAfter + .slider,
    #lightBefore + .slider,
    #lightAfter + .slider,
    #oilBefore + .slider,
    #oilAfter + .slider {
      margin-right: 18px;
    }

    /* アルコール検知器・免許証携帯確認は margin なし（デフォルト） */

    .switch {
      position:relative;
      display:inline-block;
      width:52px;
      height:28px;
    }
    .switch input { display:none; }
    .slider {
      position:absolute; cursor:pointer;
      top:0; left:0; right:0; bottom:0;
      background-color:#ccc; border-radius:34px; transition:.3s;
    }
    .slider:before {
      position:absolute; content:"";
      height:22px; width:22px;
      left:3px; bottom:3px;
      background:white; border-radius:50%; transition:.3s;
    }
    .switch input:checked + .slider { background-color:#00bcd4; }
    .switch input:checked + .slider:before { transform:translateX(24px); }

    @media (max-width:480px) {
      form { margin:20px; padding:18px; }
      .inline-group { flex-direction:column; gap:12px; }
      .check-item { font-size:15px; }
    }
  </style>
</head>

<body onload="init()">
<h2 style="text-align:center;">業務の記録</h2>

<form id="form">

  <!-- 日付 & 点呼時刻 -->
  <div class="inline-group">
    <div style="flex:1;">
      <label>日付</label>
      <input type="date" id="date" required>
    </div>
    <div style="flex:1;">
      <label>点呼時刻</label>
      <input type="time" id="callTime" required>
    </div>
  </div>

  <!-- 点呼区分 -->
  <label>点呼区分</label>
  <div style="display:flex; align-items:center; gap:10px;">
    <label class="switch">
      <input type="checkbox" id="callTypeToggle">
      <span class="slider"></span>
    </label>
    <span id="callTypeResult" style="font-weight:bold;">業務前</span>
  </div>
  <input type="hidden" id="callTypeHidden" value="業務前">

  <!-- 走行距離（業務前のみ） -->
  <label id="beforeLabel">走行距離計（運行前）</label>
  <div style="display:flex; align-items:center;">
    <input type="number" id="distanceBefore" class="distance-box">
    <span class="km-label">km</span>
  </div>

  <!-- 業務後：走行距離計（運行後） -->
  <label class="hidden" id="afterLabel">走行距離計（運行後）</label>
  <div style="display:flex; align-items:center;" id="afterBox" class="hidden">
    <input type="number" id="distanceAfter" class="distance-box hidden">
    <span class="km-label hidden" id="afterKm">km</span>
  </div>

  <!-- 業務後：当日の総走行距離計 -->
  <label class="hidden" id="totalDistanceLabel">当日の総走行距離計</label>
  <div style="display:flex; align-items:center;" id="totalBox" class="hidden">
    <input type="number" id="totalDistance" class="distance-box hidden" readonly>
    <span class="km-label hidden" id="totalKm">km</span>
  </div>

  <!-- 業務前 点検項目 -->
  <div id="checklistBefore">
    <label>点検項目（業務前）</label>

    <div class="check-item">
      <span>アルコール検知器の使用の有無</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="alcoholBefore">
          <span class="slider"></span>
        </label>
        <span id="alcoholBeforeStatus">使用</span>
      </div>
    </div>

    <div class="check-item">
      <span>車両異常確認</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="vehicleBefore">
          <span class="slider"></span>
        </label>
        <span id="vehicleBeforeStatus">正常</span>
      </div>
    </div>

    <div class="check-item">
      <span>体調確認</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="conditionBefore">
          <span class="slider"></span>
        </label>
        <span id="conditionBeforeStatus">良好</span>
      </div>
    </div>

    <div class="check-item">
      <span>酒気帯びの有無</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="drunkBefore">
          <span class="slider"></span>
        </label>
        <span id="drunkBeforeStatus">無</span>
      </div>
    </div>

    <div class="check-item">
      <span>免許証携帯確認</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="licenseBefore">
          <span class="slider"></span>
        </label>
        <span id="licenseBeforeStatus">携帯</span>
      </div>
    </div>

    <div class="check-item">
      <span>タイヤ（亀裂・空気圧・摩耗）</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="tireBefore">
          <span class="slider"></span>
        </label>
        <span id="tireBeforeStatus">正常</span>
      </div>
    </div>

    <div class="check-item">
      <span>灯火類（方向指示器・前照灯・車幅灯・制動灯）</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="lightBefore">
          <span class="slider"></span>
        </label>
        <span id="lightBeforeStatus">正常</span>
      </div>
    </div>

    <div class="check-item">
      <span>油脂類（エンジン・ミッション・パワステ・ブレーキ・冷却水）</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="oilBefore">
          <span class="slider"></span>
        </label>
        <span id="oilBeforeStatus">正常</span>
      </div>
    </div>
  </div>

  <!-- 業務後 点検項目 -->
  <div id="checklistAfter" class="hidden">
    <label>点検項目（業務後）</label>

    <div class="check-item">
      <span>アルコール検知器の使用の有無</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="alcoholAfter">
          <span class="slider"></span>
        </label>
        <span id="alcoholAfterStatus">使用</span>
      </div>
    </div>

    <div class="check-item">
      <span>車両異常確認</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="vehicleAfter">
          <span class="slider"></span>
        </label>
        <span id="vehicleAfterStatus">正常</span>
      </div>
    </div>

    <div class="check-item">
      <span>体調確認</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="conditionAfter">
          <span class="slider"></span>
        </label>
        <span id="conditionAfterStatus">良好</span>
      </div>
    </div>

    <div class="check-item">
      <span>酒気帯びの有無</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="drunkAfter">
          <span class="slider"></span>
        </label>
        <span id="drunkAfterStatus">無</span>
      </div>
    </div>

    <div class="check-item">
      <span>免許証携帯確認</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="licenseAfter">
          <span class="slider"></span>
        </label>
        <span id="licenseAfterStatus">携帯</span>
      </div>
    </div>

    <div class="check-item">
      <span>タイヤ（亀裂・空気圧・摩耗）</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="tireAfter">
          <span class="slider"></span>
        </label>
        <span id="tireAfterStatus">正常</span>
      </div>
    </div>

    <div class="check-item">
      <span>灯火類（方向指示器・前照灯・車幅灯・制動灯）</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="lightAfter">
          <span class="slider"></span>
        </label>
        <span id="lightAfterStatus">正常</span>
      </div>
    </div>

    <div class="check-item">
      <span>油脂類（エンジン・ミッション・パワステ・ブレーキ・冷却水）</span>
      <div>
        <label class="switch">
          <input type="checkbox" id="oilAfter">
          <span class="slider"></span>
        </label>
        <span id="oilAfterStatus">正常</span>
      </div>
    </div>
  </div>

  <button type="submit">登録を保存する</button>
</form>

<script>
function init() {
  const now = new Date();
  date.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  callTime.value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

function calcTotal() {
  const before = Number(distanceBefore.value);
  const after = Number(distanceAfter.value);

  if (!isNaN(before) && !isNaN(after) && after >= before) {
    totalDistance.value = after - before;
  } else {
    totalDistance.value = "";
  }
}

distanceBefore.addEventListener("input", calcTotal);
distanceAfter.addEventListener("input", calcTotal);

callTypeToggle.addEventListener("change", e => {
  const after = e.target.checked;

  callTypeResult.textContent = after ? "業務後" : "業務前";
  callTypeHidden.value = after ? "業務後" : "業務前";

  beforeLabel.classList.toggle("hidden", after);
  distanceBefore.classList.toggle("hidden", after);

  afterLabel.classList.toggle("hidden", !after);
  distanceAfter.classList.toggle("hidden", !after);
  afterKm.classList.toggle("hidden", !after);

  totalDistanceLabel.classList.toggle("hidden", !after);
  totalDistance.classList.toggle("hidden", !after);
  totalKm.classList.toggle("hidden", !after);

  checklistBefore.classList.toggle("hidden", after);
  checklistAfter.classList.toggle("hidden", !after);
});

function bindStatus(toggleId, statusId, onText, offText) {
  document.getElementById(toggleId).addEventListener("change", e => {
    document.getElementById(statusId).textContent =
      e.target.checked ? onText : offText;
  });
}

bindStatus("alcoholBefore", "alcoholBeforeStatus", "使用", "未使用");
bindStatus("vehicleBefore", "vehicleBeforeStatus", "正常", "異常");
bindStatus("conditionBefore", "conditionBeforeStatus", "良好", "不調");
bindStatus("drunkBefore", "drunkBeforeStatus", "無", "有");
bindStatus("licenseBefore", "licenseBeforeStatus", "携帯", "不携帯");
bindStatus("tireBefore", "tireBeforeStatus", "正常", "異常");
bindStatus("lightBefore", "lightBeforeStatus", "正常", "異常");
bindStatus("oilBefore", "oilBeforeStatus", "正常", "異常");

bindStatus("alcoholAfter", "alcoholAfterStatus", "使用", "未使用");
bindStatus("vehicleAfter", "vehicleAfterStatus", "正常", "異常");
bindStatus("conditionAfter", "conditionAfterStatus", "良好", "不調");
bindStatus("drunkAfter", "drunkAfterStatus", "無", "有");
bindStatus("licenseAfter", "licenseAfterStatus", "携帯", "不携帯");
bindStatus("tireAfter", "tireAfterStatus", "正常", "異常");
bindStatus("lightAfter", "lightAfterStatus", "正常", "異常");
bindStatus("oilAfter", "oilAfterStatus", "正常", "異常");

form.addEventListener("submit", e => {
  e.preventDefault();

  const checklist = {
    alcoholBefore: alcoholBeforeStatus.textContent,
    vehicleBefore: vehicleBeforeStatus.textContent,
    conditionBefore: conditionBeforeStatus.textContent,
    drunkBefore: drunkBeforeStatus.textContent,
    licenseBefore: licenseBeforeStatus.textContent,
    tireBefore: tireBeforeStatus.textContent,
    lightBefore: lightBeforeStatus.textContent,
    oilBefore: oilBeforeStatus.textContent,

    alcoholAfter: alcoholAfterStatus.textContent,
    vehicleAfter: vehicleAfterStatus.textContent,
    conditionAfter: conditionAfterStatus.textContent,
    drunkAfter: drunkAfterStatus.textContent,
    licenseAfter: licenseAfterStatus.textContent,
    tireAfter: tireAfterStatus.textContent,
    lightAfter: lightAfterStatus.textContent,
    oilAfter: oilAfterStatus.textContent
  };

  const data = {
    date: date.value,
    callType: callTypeHidden.value,
    callTime: callTime.value,
    distanceBefore: distanceBefore.value,
    distanceAfter: distanceAfter.value,
    totalDistance: totalDistance.value,
    checklist: checklist
  };

  fetch("GAS_WEBAPP_URL", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(data)
  })
  .then(r => r.json())
  .then(() => {
    alert("保存しました");
    form.reset();
    init();
  })
  .catch(() => alert("保存失敗"));
});
</script>

</body>
</html>
