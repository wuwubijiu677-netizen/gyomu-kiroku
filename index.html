<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>業務の記録</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: system-ui; background:#f9f9f9; margin:0; }
form { max-width:600px; margin:30px auto; background:#fff; padding:18px; border-radius:12px; }
.hidden { display:none; }

.switch { position:relative; width:40px; height:20px; display:inline-block; }
.switch input { display:none; }
.slider { position:absolute; inset:0; background:#ccc; border-radius:34px; }
.slider:before { content:""; position:absolute; width:16px; height:16px; left:2px; bottom:2px; background:#fff; border-radius:50%; }
.switch input:checked + .slider { background:#00bcd4; }
.switch input:checked + .slider:before { transform:translateX(20px); }
</style>
</head>

<body onload="init()">
<form>

<label>点呼区分</label>
<label class="switch">
  <input type="checkbox" id="callTypeToggle">
  <span class="slider"></span>
</label>
<span id="callTypeResult">業務前</span>
<input type="hidden" id="callTypeHidden" value="業務前">

<div id="checklistBefore">
  <p>業務前チェック</p>
  <label class="switch">
    <input type="checkbox" id="alcoholBefore">
    <span class="slider"></span>
  </label>
  <span id="alcoholBeforeStatus">使用</span>
</div>

<div id="checklistAfter" class="hidden">
  <p>業務後チェック</p>
  <label class="switch">
    <input type="checkbox" id="alcoholAfter">
    <span class="slider"></span>
  </label>
  <span id="alcoholAfterStatus">使用</span>
</div>

</form>

<script>
function init() {

  /* ===== 点呼区分切り替え ===== */
  const callTypeToggle = document.getElementById("callTypeToggle");
  const callTypeResult = document.getElementById("callTypeResult");
  const callTypeHidden = document.getElementById("callTypeHidden");
  const checklistBefore = document.getElementById("checklistBefore");
  const checklistAfter = document.getElementById("checklistAfter");

  callTypeToggle.addEventListener("change", e => {
    const isAfter = e.target.checked;
    callTypeResult.textContent = isAfter ? "業務後" : "業務前";
    callTypeHidden.value = isAfter ? "業務後" : "業務前";
    checklistBefore.classList.toggle("hidden", isAfter);
    checklistAfter.classList.toggle("hidden", !isAfter);
  });

  /* ===== ステータス表示 ===== */
  function bindStatus(toggleId, statusId, onText, offText) {
    const toggle = document.getElementById(toggleId);
    const status = document.getElementById(statusId);
    toggle.addEventListener("change", e => {
      status.textContent = e.target.checked ? onText : offText;
    });
  }

  bindStatus("alcoholBefore","alcoholBeforeStatus","使用","未使用");
  bindStatus("alcoholAfter","alcoholAfterStatus","使用","未使用");

  /* ===== 距離計算（完全に変更なし） ===== */
  function calcTotal() {
    const before = Number(distanceBefore.value);
    const after = Number(distanceAfter.value);
    if (!isNaN(before) && !isNaN(after) && after >= before) {
      totalDistance.value = after - before;
    } else {
      totalDistance.value = "";
    }
  }

  const distanceBefore = document.getElementById("distanceBefore");
  const distanceAfter  = document.getElementById("distanceAfter");
  const totalDistance  = document.getElementById("totalDistance");

  if (distanceBefore && distanceAfter && totalDistance) {
    distanceBefore.addEventListener("input", calcTotal);
    distanceAfter.addEventListener("input", calcTotal);
  }
}
</script>
</body>
</html>
